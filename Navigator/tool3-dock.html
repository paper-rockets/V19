<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Navigator dock</title>
<script src="js/three.min.js"></script>
<script>if (typeof THREE === "undefined") document.write('<script src="../js/three.min.js"><\/script>');</script>
<script>if (typeof THREE === "undefined") document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<style>
/* ══════════════════════════════════════════════════════════════════
   DEMO HOST CHROME — stands in for Drawing Canvas. Delete this block
   when you paste the dock into the real app.
   ══════════════════════════════════════════════════════════════════ */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#eeeeec;touch-action:none;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#111}
  #view{position:fixed;inset:0;display:block;touch-action:none;z-index:1}
  .host{position:fixed;z-index:40;color:#3a3d41}
  #host-top{top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:18px;padding:0 14px;
    background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(17,17,17,.07);font-size:14px;font-weight:600}
  #host-top .ic{font-weight:400;font-size:16px;color:#6b7076}
  #host-rail{left:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:20px;
    font-size:19px;color:#6b7076}
  #host-rail .dot{width:34px;height:34px;border-radius:17px;background:#35a7e8;display:block}
  #host-zoom{right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:16px;
    padding:14px 12px;border-radius:22px;background:#1c1f23;color:#fff;font-size:17px}
  #host-fps{right:12px;bottom:8px;font-size:12px;color:#5d6167}
  #host-fps i{font-style:normal;color:#22c55e}

/* ══════════════════════════════════════════════════════════════════
   NAVIGATOR DOCK — everything below is the tool. All selectors are
   namespaced nv- so host styles and dock styles can't collide.

   Tell the dock where your chrome is; it will never sit under it:
   ══════════════════════════════════════════════════════════════════ */
  :root{
    --nv-top:60px;      /* height of your top bar */
    --nv-right:78px;    /* width of your right zoom dock */
    --nv-bottom:34px;   /* height of your FPS strip */
    --nv-left:60px;     /* width of your left tool rail */
    --nv-gap:12px;      /* breathing room from that chrome */
    --nv-ink:#111111;
    --nv-ink-60:rgba(17,17,17,.60);
    --nv-ink-38:rgba(17,17,17,.38);
    --nv-line:rgba(17,17,17,.10);
    --nv-glass:rgba(255,255,255,.62);
  }
  /* one root, one stacking context, clicks fall through the gaps */
  #nv{position:fixed;inset:0;z-index:50;pointer-events:none;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--nv-ink);font-variant-numeric:tabular-nums}
  #nv > *{pointer-events:auto}
  #nv.nv-dim{opacity:.2;transition:opacity .12s ease}
  #nv:not(.nv-dim){transition:opacity .3s ease .25s}

  .nv-card{position:absolute;width:236px;padding:8px 10px 10px;border-radius:16px;
    background:var(--nv-glass);-webkit-backdrop-filter:blur(16px) saturate(1.08);
    backdrop-filter:blur(16px) saturate(1.08);border:1px solid rgba(255,255,255,.7);
    box-shadow:0 12px 34px rgba(17,17,17,.13)}
  #nv[data-open="false"] .nv-card{display:none}

  .nv-head{display:flex;align-items:center;gap:8px;height:26px;cursor:move;touch-action:none}
  .nv-grip{display:flex;gap:2px;color:var(--nv-ink-38);flex:0 0 auto}
  .nv-grip i{width:3px;height:3px;border-radius:2px;background:currentColor;display:block}
  .nv-read{flex:1;font-size:11.5px;color:var(--nv-ink-60);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;letter-spacing:.01em}
  .nv-read b{font-weight:600;color:var(--nv-ink)}
  .nv-fold{border:0;background:none;color:var(--nv-ink-38);font:inherit;font-size:14px;line-height:1;
    padding:4px 5px;border-radius:7px;cursor:pointer}
  .nv-fold:hover{color:var(--nv-ink);background:rgba(255,255,255,.6)}

  .nv-canvas{display:block;margin:2px auto 0;cursor:grab;touch-action:none}
  #nv.nv-drag .nv-canvas{cursor:grabbing}

  .nv-modes{display:flex;gap:2px;justify-content:center;margin-top:4px}
  .nv-mode{font:inherit;font-size:12px;line-height:1;padding:8px 11px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;background:none;color:var(--nv-ink-38);min-height:34px}
  .nv-mode[aria-pressed="true"]{color:var(--nv-ink);border-color:var(--nv-line);background:rgba(255,255,255,.75)}
  .nv-hint{margin-top:5px;text-align:center;font-size:11px;line-height:1.35;color:var(--nv-ink-38);
    height:28px;display:flex;align-items:center;justify-content:center;padding:0 2px}
  .nv-hint.nv-live{color:var(--nv-ink);font-weight:500}

  /* fixed grid — never wraps into your other UI */
  .nv-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:2px}
  .nv-act{font:inherit;font-size:11.5px;line-height:1;padding:9px 2px;border-radius:9px;cursor:pointer;
    color:var(--nv-ink-60);background:rgba(255,255,255,.5);border:1px solid var(--nv-line);min-height:34px}
  .nv-act:hover{color:var(--nv-ink)}
  .nv-act[aria-pressed="true"]{color:var(--nv-ink);border-color:var(--nv-ink);background:#fff}
  .nv-act:disabled{opacity:.32;cursor:default}
  .nv-act:focus-visible,.nv-mode:focus-visible,.nv-fold:focus-visible{outline:1.5px solid var(--nv-ink);outline-offset:1px}

  /* collapsed puck */
  .nv-fab{position:absolute;width:54px;height:54px;border-radius:27px;cursor:pointer;padding:0;
    background:var(--nv-glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 26px rgba(17,17,17,.15);display:none}
  #nv[data-open="false"] .nv-fab{display:block}
  .nv-fab canvas{display:block;border-radius:27px}

  @media (max-width:420px){
    .nv-card{width:208px}
    .nv-act{font-size:11px;padding:9px 1px}
  }
</style>
</head>
<body>

<canvas id="view"></canvas>

<!-- ── demo host chrome ── -->
<div class="host" id="host-top">
  <span>Drawing Canvas</span>
  <span class="ic">↶</span><span class="ic">↷</span><span class="ic">▤</span><span class="ic">☀</span><span class="ic">⚙</span>
</div>
<div class="host" id="host-rail">
  <span>➤</span><span>✎</span><span>◻</span><span>✳</span><span>▤</span><span class="dot"></span>
</div>
<div class="host" id="host-zoom"><span>＋</span><span>－</span><span>◎</span><span>✥</span></div>
<div class="host" id="host-fps"><i>●</i> 60 FPS</div>

<!-- ── the dock: one root element, drop this whole block into the app ── -->
<div id="nv" data-open="true" data-corner="br">
  <div class="nv-card" id="nv-card">
    <div class="nv-head" id="nv-head">
      <span class="nv-grip"><i></i><i></i><i></i></span>
      <span class="nv-read" id="nv-read"></span>
      <button class="nv-fold" id="nv-fold" title="Collapse">–</button>
    </div>
    <canvas class="nv-canvas" id="nv-canvas"></canvas>
    <div class="nv-modes">
      <button class="nv-mode" id="nv-move" aria-pressed="true">Move</button>
      <button class="nv-mode" id="nv-rot" aria-pressed="false">Rotate</button>
      <button class="nv-mode" id="nv-look" aria-pressed="false">Look</button>
    </div>
    <div class="nv-hint" id="nv-hint"></div>
    <div class="nv-acts">
      <button class="nv-act" id="nv-flat">Flat</button>
      <button class="nv-act" id="nv-wall">Wall</button>
      <button class="nv-act" id="nv-45">45°</button>
      <button class="nv-act" id="nv-face">Face</button>
      <button class="nv-act" id="nv-snap" aria-pressed="true">Snap</button>
      <button class="nv-act" id="nv-fine" aria-pressed="false">Fine</button>
      <button class="nv-act" id="nv-undo" disabled>Undo</button>
      <button class="nv-act" id="nv-reset">Reset</button>
    </div>
  </div>
  <button class="nv-fab" id="nv-fab" title="Open navigator"><canvas id="nv-fab-canvas"></canvas></button>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const DEG = Math.PI / 180;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ══════════════════════════════════════════════════════════════════
   Scene — replace with your own; the dock only needs obj + cam
   ══════════════════════════════════════════════════════════════════ */
const PAPER = 0xeeeeec;
const viewCanvas = $('view');
const scene = new THREE.Scene();
scene.background = new THREE.Color(PAPER);
scene.fog = new THREE.Fog(PAPER, 20, 58);

let W = window.innerWidth, H = window.innerHeight;
const FOV = 46;
const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ canvas: viewCanvas, antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

scene.add(new THREE.AmbientLight(0xffffff, 0.72));
scene.add(new THREE.HemisphereLight(0xffffff, 0xd6d6d2, 0.45));
const key = new THREE.DirectionalLight(0xffffff, 0.95);
key.position.set(9, 15, 7);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 1; key.shadow.camera.far = 46;
key.shadow.camera.left = -14; key.shadow.camera.right = 14;
key.shadow.camera.top = 14; key.shadow.camera.bottom = -14;
scene.add(key);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.11 })
);
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(28, 28, 0xb9b9b5, 0xdcdcd8);
grid.position.y = 0.002;
grid.material.transparent = true;
grid.material.opacity = 0.9;
scene.add(grid);

const block = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.7, 0.9),
  new THREE.MeshLambertMaterial({ color: 0xfafaf8 }));
block.position.set(-2.6, 0.85, 1.6);
block.castShadow = true;
scene.add(block);
const blockEdges = new THREE.LineSegments(new THREE.EdgesGeometry(block.geometry),
  new THREE.LineBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.28 }));
blockEdges.position.copy(block.position);
scene.add(blockEdges);

const SIZE = 3.4;
const surface = new THREE.Group();
scene.add(surface);
const planeGeo = new THREE.PlaneGeometry(SIZE, SIZE).rotateX(-Math.PI / 2);
function hatchTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  x.strokeStyle = 'rgba(17,17,17,0.22)';
  x.lineWidth = 1;
  for (let i = 32; i < 256; i += 32) {
    x.beginPath(); x.moveTo(i + .5, 0); x.lineTo(i + .5, 256); x.stroke();
    x.beginPath(); x.moveTo(0, i + .5); x.lineTo(256, i + .5); x.stroke();
  }
  x.strokeStyle = 'rgba(17,17,17,0.85)'; x.lineWidth = 4;
  x.strokeRect(2, 2, 252, 252);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}
surface.add(new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({
  color: 0xffffff, transparent: true, opacity: 0.62, side: THREE.DoubleSide, depthWrite: false })));
const skin = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({
  map: hatchTexture(), transparent: true, side: THREE.DoubleSide, depthWrite: false }));
skin.renderOrder = 2;
surface.add(skin);
surface.add(new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0.62, 0)]),
  new THREE.LineBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.55 })));
const tip = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 12),
  new THREE.MeshBasicMaterial({ color: 0x111111 }));
tip.position.y = 0.62;
surface.add(tip);

const obj = { pos: new THREE.Vector3(0, 1.1, 0), quat: new THREE.Quaternion() };
const cam = { radius: 11, theta: 0.78, phi: 1.06, target: new THREE.Vector3(0, 1.1, 0) };

function applyObject() {
  surface.position.copy(obj.pos);
  surface.quaternion.copy(obj.quat);
  const e = new THREE.Euler().setFromQuaternion(obj.quat, 'YXZ');
  $('nv-read').innerHTML =
    'h <b>' + obj.pos.y.toFixed(2) + '</b>  ·  tilt <b>' + Math.round(e.x / DEG) + '°</b>' +
    '  ·  turn <b>' + Math.round(e.y / DEG) + '°</b>  ·  bank <b>' + Math.round(e.z / DEG) + '°</b>';
  drawGizmo();
}
function applyCamera() {
  const sp = Math.sin(cam.phi), cp = Math.cos(cam.phi);
  const st = Math.sin(cam.theta), ct = Math.cos(cam.theta);
  camera.position.set(
    cam.target.x + cam.radius * sp * st,
    cam.target.y + cam.radius * cp,
    cam.target.z + cam.radius * sp * ct);
  camera.lookAt(cam.target);
  drawGizmo();
}

/* ══════════════════════════════════════════════════════════════════
   Gizmo drawing
   ══════════════════════════════════════════════════════════════════ */
const gz = { size: 150, mode: 'move', snap: true, fine: false, active: null, hover: null };
const gzc = $('nv-canvas');
const gctx = gzc.getContext('2d');
const fabc = $('nv-fab-canvas');
const fctx = fabc.getContext('2d');

const AXES = [
  { dir: [0, 1, 0], lbl: 'Y', tone: '#111111', ink: '#ffffff' },
  { dir: [1, 0, 0], lbl: 'X', tone: '#7c7c7a', ink: '#ffffff' },
  { dir: [0, 0, 1], lbl: 'Z', tone: '#c2c2be', ink: '#111111' }
];

function metrics(S) {
  return { S, c: S / 2, arm: S * 0.28, hand: S * 0.088, hub: S * 0.108, ring: S * 0.46 };
}
function fitCanvas(canvas, ctx, size) {
  const dpr = Math.min(window.devicePixelRatio, 2);
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function axisDir(a) {
  const v = new THREE.Vector3(a.dir[0], a.dir[1], a.dir[2]);
  if (gz.mode !== 'look') v.applyQuaternion(obj.quat);
  return v.normalize();
}
function project(v, m) {
  const sp = Math.sin(cam.phi), cp = Math.cos(cam.phi);
  const st = Math.sin(cam.theta), ct = Math.cos(cam.theta);
  const sx = v.x * ct + v.z * -st;
  const sy = v.x * (-cp * st) + v.y * sp + v.z * (-cp * ct);
  const depth = v.x * (sp * st) + v.y * cp + v.z * (sp * ct);
  return { x: m.c + sx * m.arm, y: m.c - sy * m.arm, depth, len: Math.hypot(sx, sy) };
}
function handles(m) {
  const out = [];
  AXES.forEach((a, i) => {
    const d = axisDir(a);
    out.push({ a, i, sign: 1, dir: d, p: project(d, m) });
    const n = d.clone().negate();
    out.push({ a, i, sign: -1, dir: n, p: project(n, m) });
  });
  return out;
}

function paint(ctx, m, interactive) {
  ctx.clearRect(0, 0, m.S, m.S);
  ctx.beginPath();
  ctx.arc(m.c, m.c, m.ring, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.34)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(17,17,17,0.12)';
  ctx.lineWidth = 1;
  ctx.stroke();

  const hs = handles(m).sort((p, q) => p.p.depth - q.p.depth);

  hs.forEach(h => {
    const front = h.p.depth >= -0.04;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(m.c, m.c);
    ctx.lineTo(h.p.x, h.p.y);
    if (h.sign > 0 && front) { ctx.strokeStyle = h.a.tone; ctx.lineWidth = 2.2; }
    else { ctx.strokeStyle = 'rgba(17,17,17,0.18)'; ctx.lineWidth = 1; ctx.setLineDash([3, 4]); }
    ctx.stroke();
    ctx.restore();
  });

  hs.forEach(h => {
    const front = h.p.depth >= -0.04;
    const on = interactive && gz.active && gz.active.type === 'axis' && gz.active.i === h.i && gz.active.sign === h.sign;
    const hov = interactive && gz.hover && gz.hover.i === h.i && gz.hover.sign === h.sign;

    if (h.sign < 0 || !front) {
      ctx.beginPath();
      ctx.arc(h.p.x, h.p.y, m.hand * (h.sign < 0 ? 0.62 : 0.76), 0, Math.PI * 2);
      ctx.fillStyle = (on || hov) ? 'rgba(17,17,17,0.42)' : 'rgba(17,17,17,0.2)';
      ctx.fill();
      return;
    }
    if (h.p.len > (gz.mode === 'rotate' ? 0.34 : 0.22)) {
      const ux = (h.p.x - m.c) / (m.arm * h.p.len), uy = (h.p.y - m.c) / (m.arm * h.p.len);
      ctx.save();
      ctx.translate(h.p.x, h.p.y);
      ctx.rotate(Math.atan2(uy, ux));
      ctx.fillStyle = h.a.tone;
      ctx.strokeStyle = h.a.tone;
      if (gz.mode === 'rotate') {
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, m.hand * 1.46, -0.94, 0.94);
        ctx.stroke();
        const ax = Math.cos(0.94) * m.hand * 1.46, ay = Math.sin(0.94) * m.hand * 1.46;
        ctx.beginPath();
        ctx.moveTo(ax + 3, ay + 1); ctx.lineTo(ax - 2.4, ay + 3.1); ctx.lineTo(ax - 1, ay - 2.4);
        ctx.closePath(); ctx.fill();
      } else {
        const base = m.hand * 1.08, wide = m.hand * 0.55;
        ctx.beginPath();
        ctx.moveTo(base + m.hand * 1.05, 0);
        ctx.lineTo(base, -wide);
        ctx.lineTo(base, wide);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
    ctx.beginPath();
    ctx.arc(h.p.x, h.p.y, m.hand * (on || hov ? 1.08 : 1), 0, Math.PI * 2);
    ctx.fillStyle = h.a.tone;
    ctx.fill();
    if (on || hov) {
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(h.p.x, h.p.y, m.hand * 1.4, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = h.a.ink;
    ctx.font = '600 ' + (m.hand * 1.0).toFixed(1) + 'px ' + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(h.a.lbl, h.p.x, h.p.y + 0.5);
  });

  ctx.beginPath();
  ctx.arc(m.c, m.c, m.hub, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fill();
  ctx.strokeStyle = interactive && gz.active && gz.active.type === 'hub' ? '#111111' : 'rgba(17,17,17,0.42)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  hubIcon(ctx, m.c, m.c, m.hub * 0.62);
}
function hubIcon(ctx, cx, cy, r) {
  ctx.save();
  ctx.strokeStyle = '#111111'; ctx.fillStyle = '#111111'; ctx.lineWidth = 1.3;
  if (gz.mode === 'move') {
    for (let k = 0; k < 4; k++) {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(k * Math.PI / 2);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r * 0.86, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r, 0); ctx.lineTo(r * 0.6, -r * 0.32); ctx.lineTo(r * 0.6, r * 0.32);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
  } else if (gz.mode === 'rotate') {
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.82, -2.5, 1.7); ctx.stroke();
    const ax = cx + Math.cos(1.7) * r * 0.82, ay = cy + Math.sin(1.7) * r * 0.82;
    ctx.beginPath();
    ctx.moveTo(ax + 3.4, ay - 0.4); ctx.lineTo(ax - 1.4, ay + 3.4); ctx.lineTo(ax - 2.6, ay - 2.4);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.34, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.9, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}
function drawGizmo() {
  if ($('nv').dataset.open === 'true') paint(gctx, metrics(gz.size), true);
  else paint(fctx, metrics(54), false);
}

/* ══════════════════════════════════════════════════════════════════
   Interaction
   ══════════════════════════════════════════════════════════════════ */
function gzPoint(e) {
  const r = gzc.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (gz.size / r.width), y: (e.clientY - r.top) * (gz.size / r.height) };
}
function pickHandle(pt) {
  const m = metrics(gz.size);
  const near = [];
  handles(m).forEach(h => {
    const d = Math.hypot(pt.x - h.p.x, pt.y - h.p.y);
    if (d < m.hand * (h.sign > 0 ? 1.85 : 1.5)) near.push({ h, d, front: h.p.depth >= -0.04 });
  });
  if (!near.length) return null;
  near.sort((a, b) => a.d - b.d);
  const tie = near.find(c => c.front && c.d <= near[0].d + m.hand * 0.4);
  return (tie || near[0]).h;
}
function unitsPerPixel() { return (2 * cam.radius * Math.tan(FOV * DEG / 2)) / H; }
function camBasis() {
  const sp = Math.sin(cam.phi), cp = Math.cos(cam.phi);
  const st = Math.sin(cam.theta), ct = Math.cos(cam.theta);
  return { right: new THREE.Vector3(ct, 0, -st), up: new THREE.Vector3(-cp * st, sp, -cp * ct) };
}
const history = [];
function pushHistory() {
  history.push({ p: obj.pos.clone(), q: obj.quat.clone() });
  if (history.length > 40) history.shift();
  $('nv-undo').disabled = false;
}
function undo() {
  const s = history.pop();
  if (!s) return;
  obj.pos.copy(s.p); obj.quat.copy(s.q);
  applyObject();
  $('nv-undo').disabled = history.length === 0;
  say('Undone', true);
}
let hintTimer = null;
function say(t, live) {
  const el = $('nv-hint');
  el.textContent = t;
  el.classList.toggle('nv-live', !!live);
  if (hintTimer) clearTimeout(hintTimer);
  if (live) hintTimer = setTimeout(idleHint, 1400);
}
function idleHint() {
  const el = $('nv-hint');
  el.classList.remove('nv-live');
  el.textContent = gz.mode === 'look' ? 'Tap an axis to face it'
    : gz.mode === 'move' ? 'Drag an axis to slide · hub to float'
    : 'Drag an axis to turn around it';
}

let drag = null;
gzc.addEventListener('pointerdown', (e) => {
  e.preventDefault(); e.stopPropagation();
  const pt = gzPoint(e), m = metrics(gz.size);
  const r = Math.hypot(pt.x - m.c, pt.y - m.c);
  const hit = pickHandle(pt);
  if (hit) gz.active = { type: 'axis', i: hit.i, sign: hit.sign };
  else if (r <= m.hub * 1.25 && gz.mode !== 'look') gz.active = { type: 'hub' };
  else gz.active = { type: 'orbit' };
  drag = {
    startX: e.clientX, startY: e.clientY, moved: false, hit,
    pos: obj.pos.clone(), quat: obj.quat.clone(),
    theta: cam.theta, phi: cam.phi,
    startAngle: Math.atan2(pt.y - m.c, pt.x - m.c), committed: false
  };
  $('nv').classList.add('nv-drag');
  gzc.setPointerCapture(e.pointerId);
  drawGizmo();
});
gzc.addEventListener('pointermove', (e) => {
  const m = metrics(gz.size);
  if (!drag) {
    const hit = pickHandle(gzPoint(e));
    const changed = (hit ? hit.i + ':' + hit.sign : '') !== (gz.hover ? gz.hover.i + ':' + gz.hover.sign : '');
    gz.hover = hit ? { i: hit.i, sign: hit.sign } : null;
    gzc.style.cursor = hit ? 'pointer' : 'grab';
    if (changed) drawGizmo();
    return;
  }
  const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
  if (!drag.moved && Math.hypot(dx, dy) < 3.5) return;
  drag.moved = true;

  const fine = gz.fine || e.shiftKey, gain = fine ? 0.22 : 1, snapping = gz.snap && !fine;
  const act = gz.active;

  if (act.type === 'orbit' || (act.type === 'axis' && gz.mode === 'look')) {
    cam.theta = drag.theta - dx * 0.0062 * gain;
    cam.phi = Math.max(0.06, Math.min(Math.PI - 0.06, drag.phi - dy * 0.0062 * gain));
    applyCamera();
    say('Orbiting', true);
    return;
  }
  if (!drag.committed) { pushHistory(); drag.committed = true; }

  if (act.type === 'hub') {
    if (gz.mode === 'move') {
      const b = camBasis(), k = unitsPerPixel() * gain;
      obj.pos.copy(drag.pos).addScaledVector(b.right, dx * k).addScaledVector(b.up, -dy * k);
      if (snapping) { obj.pos.x = snap(obj.pos.x, .25); obj.pos.y = snap(obj.pos.y, .25); obj.pos.z = snap(obj.pos.z, .25); }
      clampPos(); applyObject();
      say('Floating  ' + obj.pos.x.toFixed(2) + ' , ' + obj.pos.y.toFixed(2) + ' , ' + obj.pos.z.toFixed(2), true);
    } else {
      const b = camBasis();
      let ay = -dx * 0.5 * gain, ax = -dy * 0.5 * gain;
      if (snapping) { ay = snap(ay, 15); ax = snap(ax, 15); }
      const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), ay * DEG)
        .multiply(new THREE.Quaternion().setFromAxisAngle(b.right, ax * DEG));
      obj.quat.copy(drag.quat).premultiply(q);
      applyObject();
      say('Turning freely', true);
    }
    return;
  }

  const h = drag.hit, a = AXES[h.i], worldDir = h.dir, p = project(worldDir, m);
  if (gz.mode === 'move') {
    const len = Math.max(0.001, p.len);
    const nx = (p.x - m.c) / (m.arm * len), ny = (p.y - m.c) / (m.arm * len);
    let amount = (dx * nx + dy * ny) * unitsPerPixel() * gain / Math.max(0.30, len);
    if (snapping) amount = snap(amount, .25);
    obj.pos.copy(drag.pos).addScaledVector(worldDir, amount);
    clampPos(); applyObject();
    say('Along ' + a.lbl + '  ' + (amount >= 0 ? '+' : '') + amount.toFixed(2) + ' m', true);
  } else {
    const pt = gzPoint(e);
    let d = Math.atan2(pt.y - m.c, pt.x - m.c) - drag.startAngle;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    let deg = -(d / DEG) * (p.depth >= 0 ? 1 : -1) * gain;
    if (snapping) deg = snap(deg, 15);
    obj.quat.copy(drag.quat).premultiply(new THREE.Quaternion().setFromAxisAngle(worldDir, deg * DEG));
    applyObject();
    say('Turn around ' + a.lbl + '  ' + (deg > 0 ? '+' : '') + Math.round(deg) + '°', true);
  }
});
function endDrag(e) {
  if (!drag) return;
  if (!drag.moved && drag.hit) faceDirection(drag.hit.dir, drag.hit.a.lbl, drag.hit.sign);
  else if (!drag.moved && gz.active && gz.active.type === 'hub') setMode(gz.mode === 'move' ? 'rotate' : 'move');
  gz.active = null; drag = null;
  $('nv').classList.remove('nv-drag');
  try { gzc.releasePointerCapture(e.pointerId); } catch (_) {}
  drawGizmo(); idleHint();
  $('nv-undo').disabled = history.length === 0;
}
gzc.addEventListener('pointerup', endDrag);
gzc.addEventListener('pointercancel', endDrag);
function snap(v, step) { return Math.round(v / step) * step; }
function clampPos() {
  obj.pos.x = Math.max(-12, Math.min(12, obj.pos.x));
  obj.pos.y = Math.max(-3, Math.min(9, obj.pos.y));
  obj.pos.z = Math.max(-12, Math.min(12, obj.pos.z));
}

let flight = null;
function faceDirection(dir, label, sign) {
  const d = dir.clone().normalize();
  flyTo(Math.acos(Math.max(-1, Math.min(1, d.y))), Math.atan2(d.x, d.z));
  if (label) say('Facing ' + (sign < 0 ? '−' : '') + label, true);
  if (navigator.vibrate) { try { navigator.vibrate(8); } catch (_) {} }
}
function flyTo(phi, theta) {
  let t = theta;
  while (t - cam.theta > Math.PI) t -= Math.PI * 2;
  while (t - cam.theta < -Math.PI) t += Math.PI * 2;
  const p1 = Math.max(0.06, Math.min(Math.PI - 0.06, phi));
  if (reduceMotion) { cam.phi = p1; cam.theta = t; applyCamera(); return; }
  flight = { p0: cam.phi, t0: cam.theta, p1, t1: t, start: performance.now(), ms: 440 };
}
function stepFlight(now) {
  if (!flight) return;
  const k = Math.min(1, (now - flight.start) / flight.ms);
  const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  cam.phi = flight.p0 + (flight.p1 - flight.p0) * e;
  cam.theta = flight.t0 + (flight.t1 - flight.t0) * e;
  applyCamera();
  if (k >= 1) flight = null;
}

/* ── host viewport (your app's canvas already does this) ─────────── */
const pointers = new Map();
let vp = null;
viewCanvas.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  viewCanvas.setPointerCapture(e.pointerId);
  if (pointers.size === 1) vp = { mode: 'orbit', x: e.clientX, y: e.clientY, theta: cam.theta, phi: cam.phi, target: cam.target.clone() };
  else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    vp = { mode: 'pinch', dist: Math.hypot(a.x - b.x, a.y - b.y), radius: cam.radius, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, target: cam.target.clone() };
  }
});
viewCanvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId) || !vp) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  flight = null;
  if (vp.mode === 'pinch' && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    cam.radius = Math.max(2.5, Math.min(44, vp.radius * (vp.dist / Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)))));
    applyCamera();
    return;
  }
  cam.theta = vp.theta - (e.clientX - vp.x) * 0.0042;
  cam.phi = Math.max(0.06, Math.min(Math.PI - 0.06, vp.phi - (e.clientY - vp.y) * 0.0042));
  applyCamera();
});
function clearPointer(e) {
  pointers.delete(e.pointerId);
  if (!pointers.size) vp = null;
  try { viewCanvas.releasePointerCapture(e.pointerId); } catch (_) {}
}
viewCanvas.addEventListener('pointerup', clearPointer);
viewCanvas.addEventListener('pointercancel', clearPointer);
viewCanvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  cam.radius = Math.max(2.5, Math.min(44, cam.radius * (e.deltaY > 0 ? 1.08 : 0.92)));
  applyCamera();
}, { passive: false });

/* ══════════════════════════════════════════════════════════════════
   Dock placement: safe area, corner snap, collapse, auto-dim
   ══════════════════════════════════════════════════════════════════ */
const nv = $('nv'), card = $('nv-card'), fab = $('nv-fab');
function cssPx(name) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return parseFloat(v) || 0;
}
function safeBox() {
  const gap = cssPx('--nv-gap');
  return {
    left: cssPx('--nv-left') + gap,
    top: cssPx('--nv-top') + gap,
    right: window.innerWidth - cssPx('--nv-right') - gap,
    bottom: window.innerHeight - cssPx('--nv-bottom') - gap
  };
}
function panel() { return nv.dataset.open === 'true' ? card : fab; }
function place(x, y) {
  const el = panel(), s = safeBox();
  const w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.round(Math.max(s.left, Math.min(s.right - w, x))) + 'px';
  el.style.top = Math.round(Math.max(s.top, Math.min(s.bottom - h, y))) + 'px';
}
function toCorner(corner) {
  const el = panel(), s = safeBox();
  const w = el.offsetWidth, h = el.offsetHeight;
  const x = corner[1] === 'l' ? s.left : s.right - w;
  const y = corner[0] === 't' ? s.top : s.bottom - h;
  nv.dataset.corner = corner;
  place(x, y);
}
function nearestCorner() {
  const r = panel().getBoundingClientRect();
  return (r.top + r.height / 2 < window.innerHeight / 2 ? 't' : 'b') +
         (r.left + r.width / 2 < window.innerWidth / 2 ? 'l' : 'r');
}
// drag the dock by its header (or the collapsed puck)
[[$('nv-head'), () => card], [fab, () => fab]].forEach(([handle, get]) => {
  let d = null;
  handle.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.nv-fold')) return;
    e.preventDefault();
    const r = get().getBoundingClientRect();
    d = { x: e.clientX, y: e.clientY, left: r.left, top: r.top, moved: false };
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', (e) => {
    if (!d) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (!d.moved && Math.hypot(dx, dy) < 4) return;
    d.moved = true;
    place(d.left + dx, d.top + dy);
  });
  handle.addEventListener('pointerup', (e) => {
    if (!d) return;
    const moved = d.moved;
    d = null;
    try { handle.releasePointerCapture(e.pointerId); } catch (_) {}
    if (moved) toCorner(nearestCorner());
    else if (handle === fab) setOpen(true);
  });
});
function setOpen(open) {
  nv.dataset.open = String(open);
  $('nv-fold').textContent = '–';
  requestAnimationFrame(() => {
    if (open) fitCanvas(gzc, gctx, gz.size); else fitCanvas(fabc, fctx, 54);
    toCorner(nv.dataset.corner);
    drawGizmo();
  });
}
$('nv-fold').onclick = () => setOpen(false);

// while the user works on the host canvas, the dock steps out of the way
document.addEventListener('pointerdown', (e) => {
  if (!nv.contains(e.target)) nv.classList.add('nv-dim');
}, true);
['pointerup', 'pointercancel'].forEach(ev =>
  document.addEventListener(ev, () => nv.classList.remove('nv-dim'), true));

/* ── controls ────────────────────────────────────────────────────── */
function setMode(mode) {
  gz.mode = mode;
  [['nv-move', 'move'], ['nv-rot', 'rotate'], ['nv-look', 'look']]
    .forEach(([id, v]) => $(id).setAttribute('aria-pressed', String(mode === v)));
  idleHint(); drawGizmo();
}
$('nv-move').onclick = () => setMode('move');
$('nv-rot').onclick = () => setMode('rotate');
$('nv-look').onclick = () => setMode('look');

function setOrient(pitch, roll, label) {
  pushHistory();
  const e = new THREE.Euler().setFromQuaternion(obj.quat, 'YXZ');
  obj.quat.setFromEuler(new THREE.Euler(pitch * DEG, e.y, roll * DEG, 'YXZ'));
  applyObject(); say(label, true);
}
$('nv-flat').onclick = () => setOrient(0, 0, 'Flat');
$('nv-wall').onclick = () => setOrient(90, 0, 'Upright');
$('nv-45').onclick = () => setOrient(45, 0, '45°');
$('nv-face').onclick = () => {
  cam.target.copy(obj.pos);
  faceDirection(new THREE.Vector3(0, 1, 0).applyQuaternion(obj.quat), '', 1);
  say('Facing the surface', true);
};
$('nv-snap').onclick = () => {
  gz.snap = !gz.snap;
  $('nv-snap').setAttribute('aria-pressed', String(gz.snap));
  say(gz.snap ? 'Snap 0.25 m · 15°' : 'Snap off', true);
};
$('nv-fine').onclick = () => {
  gz.fine = !gz.fine;
  $('nv-fine').setAttribute('aria-pressed', String(gz.fine));
  say(gz.fine ? 'Fine control' : 'Normal control', true);
};
$('nv-undo').onclick = undo;
$('nv-reset').onclick = () => {
  pushHistory();
  obj.pos.set(0, 1.1, 0); obj.quat.identity(); cam.target.set(0, 1.1, 0);
  applyObject(); applyCamera(); say('Surface reset', true);
};

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  renderer.setSize(W, H);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  applyCamera();
  toCorner(nv.dataset.corner);
});

function loop(now) {
  requestAnimationFrame(loop);
  stepFlight(now);
  renderer.render(scene, camera);
}

fitCanvas(gzc, gctx, gz.size);
fitCanvas(fabc, fctx, 54);
applyObject();
applyCamera();
idleHint();
toCorner('br');
requestAnimationFrame(loop);
</script>
</body>
</html>
