<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Instrument</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="js/three.min.js"></script>
<script>if (typeof THREE === "undefined") document.write('<script src="../js/three.min.js"><\/script>');</script>
<script>if (typeof THREE === "undefined") document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --stage-1:#f4f5f7;
    --stage-2:#dcdfe4;
    --graphite:#22262b;
    --pewter:#767d86;
    --haze:#aeb5bd;
    --brass:#a8813c;
    --line:rgba(34,38,43,.10);
    --line-2:rgba(34,38,43,.18);
    --glass:rgba(255,255,255,.46);
    --font:"Jost",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html,body{width:100%;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;
    font-family:var(--font);color:var(--graphite);
    background:radial-gradient(120% 90% at 50% 8%,var(--stage-1) 0%,var(--stage-2) 100%)}
  #view{position:fixed;inset:0;display:block;touch-action:none;z-index:1}

  .panel{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.1);
    backdrop-filter:blur(16px) saturate(1.1);border:1px solid rgba(255,255,255,.66);
    box-shadow:0 10px 30px rgba(34,38,43,.10),inset 0 1px 0 rgba(255,255,255,.85);border-radius:14px}

  /* ── instrument readout ── */
  #hud{position:fixed;top:calc(14px + env(safe-area-inset-top));left:14px;z-index:20;padding:12px 16px;
    font-variant-numeric:tabular-nums;font-weight:300;font-size:13px;letter-spacing:.02em;pointer-events:none}
  #hud table{border-collapse:collapse}
  #hud th{text-align:left;font-weight:400;color:var(--pewter);padding-right:16px;font-size:11.5px}
  #hud td{text-align:right;min-width:56px;padding:1px 0 1px 12px;color:var(--graphite)}
  #hud tr+tr th,#hud tr+tr td{border-top:1px solid var(--line)}

  /* ── top right ── */
  #utils{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:20;display:flex;
    padding:4px;gap:2px}
  .u{font:inherit;font-size:12.5px;font-weight:400;letter-spacing:.02em;color:var(--pewter);background:none;
    border:0;border-radius:10px;padding:9px 11px;cursor:pointer;min-height:38px}
  .u:hover{color:var(--graphite);background:rgba(255,255,255,.5)}
  .u[aria-pressed="true"]{color:var(--graphite);background:rgba(255,255,255,.75);
    box-shadow:inset 0 0 0 1px var(--line)}
  .u:focus-visible{outline:1.5px solid var(--graphite);outline-offset:1px}

  /* ── console ── */
  #console{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;
    display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:5px;max-width:calc(100vw - 28px)}
  .c{font:inherit;font-size:13px;font-weight:400;letter-spacing:.02em;color:var(--pewter);background:none;
    border:0;border-radius:10px;padding:11px 12px;cursor:pointer;min-height:42px;white-space:nowrap}
  .c:hover{color:var(--graphite);background:rgba(255,255,255,.55)}
  .c:active{background:rgba(255,255,255,.8)}
  .c[aria-pressed="true"]{color:var(--brass);background:rgba(168,129,60,.10);
    box-shadow:inset 0 0 0 1px rgba(168,129,60,.34)}
  .c:disabled{opacity:.3;cursor:default}
  .c:focus-visible{outline:1.5px solid var(--graphite);outline-offset:1px}
  .sep{width:1px;align-self:stretch;margin:6px 6px;background:var(--line)}

  /* ── gizmo ── */
  #gizmo{position:fixed;z-index:30;right:16px;bottom:calc(104px + env(safe-area-inset-bottom));
    touch-action:none;user-select:none;-webkit-user-select:none}
  #lens{position:absolute;left:50%;top:0;transform:translateX(-50%);border-radius:50%;
    background:linear-gradient(158deg,rgba(255,255,255,.60),rgba(255,255,255,.14));
    -webkit-backdrop-filter:blur(14px) saturate(1.14);backdrop-filter:blur(14px) saturate(1.14);
    border:1px solid rgba(255,255,255,.72);
    box-shadow:0 16px 38px rgba(34,38,43,.16),0 2px 6px rgba(34,38,43,.06),
      inset 0 1px 0 rgba(255,255,255,.95),inset 0 -10px 20px rgba(34,38,43,.045)}
  #gz-canvas{position:relative;display:block;cursor:grab;touch-action:none}
  #gizmo.dragging #gz-canvas{cursor:grabbing}
  #grip{position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:14px;cursor:move;
    display:grid;place-items:center;color:var(--haze);opacity:0;transition:opacity .2s}
  #gizmo:hover #grip{opacity:1}
  @media (pointer:coarse){#grip{opacity:.6}}

  /* segmented mode control */
  #modes{position:relative;display:flex;margin:10px auto 0;padding:3px;width:fit-content;border-radius:12px;
    background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.6);box-shadow:0 6px 18px rgba(34,38,43,.08)}
  #slider{position:absolute;top:3px;left:3px;height:calc(100% - 6px);border-radius:9px;background:#fff;
    box-shadow:0 1px 3px rgba(34,38,43,.16);transition:transform .26s cubic-bezier(.32,.72,0,1),width .26s cubic-bezier(.32,.72,0,1)}
  .m{position:relative;font:inherit;font-size:12.5px;font-weight:400;letter-spacing:.03em;color:var(--pewter);
    background:none;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;min-height:38px}
  .m[aria-pressed="true"]{color:var(--graphite)}
  .m:focus-visible{outline:1.5px solid var(--graphite);outline-offset:1px}
  @media (prefers-reduced-motion:reduce){#slider{transition:none}}

  #chip{margin:9px auto 0;width:fit-content;max-width:230px;height:32px;padding:0 12px;
    display:flex;align-items:center;justify-content:center;border-radius:10px;
    font-size:12.5px;font-weight:400;letter-spacing:.03em;font-variant-numeric:tabular-nums;
    color:var(--graphite);background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.7);
    box-shadow:0 4px 14px rgba(34,38,43,.08);opacity:0;transform:translateY(-3px);
    transition:opacity .16s ease,transform .16s ease;text-align:center}
  #chip.on{opacity:1;transform:none}
  #chip .k{color:var(--pewter);margin-right:8px}

  #legend{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));
    z-index:15;font-size:12.5px;font-weight:300;letter-spacing:.03em;color:var(--pewter);
    pointer-events:none;transition:opacity .8s ease}
  #legend.gone{opacity:0}

  @keyframes rise{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
  #gizmo{animation:rise .5s cubic-bezier(.32,.72,0,1) both}
  @media (prefers-reduced-motion:reduce){#gizmo{animation:none}}
  @media (max-width:560px){
    #hud{font-size:11.5px;padding:9px 11px}
    #hud th{font-size:10.5px;padding-right:8px}
    #hud td{min-width:42px;padding-left:8px}
    .u{padding:9px 8px;font-size:11.5px}
    #u-mirror{display:none}
    .c{padding:11px 10px}
    #legend{display:none}
  }
</style>
</head>
<body>

<canvas id="view"></canvas>

<div id="hud" class="panel">
  <table>
    <tr><th>position</th><td id="p-x">0.00</td><td id="p-y">1.10</td><td id="p-z">0.00</td></tr>
    <tr><th>rotation</th><td id="r-x">0°</td><td id="r-y">0°</td><td id="r-z">0°</td></tr>
  </table>
</div>

<div id="utils" class="panel">
  <button class="u" id="u-grid" aria-pressed="true">Grid</button>
  <button class="u" id="u-mirror" aria-pressed="true">Reflection</button>
  <button class="u" id="u-save">Save</button>
</div>

<div id="gizmo">
  <div id="lens"></div>
  <div id="grip" title="Reposition">
    <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
      <circle cx="2" cy="2" r="1.1" fill="currentColor"/><circle cx="8" cy="2" r="1.1" fill="currentColor"/>
      <circle cx="2" cy="8" r="1.1" fill="currentColor"/><circle cx="8" cy="8" r="1.1" fill="currentColor"/>
    </svg>
  </div>
  <canvas id="gz-canvas"></canvas>
  <div id="modes">
    <div id="slider"></div>
    <button class="m" id="m-move" aria-pressed="true">Move</button>
    <button class="m" id="m-rot" aria-pressed="false">Rotate</button>
    <button class="m" id="m-look" aria-pressed="false">Look</button>
  </div>
  <div id="chip"></div>
</div>

<div id="console" class="panel">
  <button class="c" id="b-flat">Flat</button>
  <button class="c" id="b-wall">Upright</button>
  <button class="c" id="b-45">45°</button>
  <span class="sep"></span>
  <button class="c" id="b-face">Face</button>
  <button class="c" id="b-snap" aria-pressed="true">Snap</button>
  <button class="c" id="b-fine" aria-pressed="false">Fine</button>
  <span class="sep"></span>
  <button class="c" id="b-undo" disabled>Undo</button>
  <button class="c" id="b-redo" disabled>Redo</button>
  <button class="c" id="b-reset">Reset</button>
</div>

<div id="legend">Tap an axis to face it · drag to transform · ring to orbit</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const DEG = Math.PI / 180;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ══════════════════════════════════════════════════════════════════
   Stage
   ══════════════════════════════════════════════════════════════════ */
const viewCanvas = $('view');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe4e7ea, 26, 62);

let W = window.innerWidth, H = window.innerHeight;
const FOV = 44;
const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 400);

const renderer = new THREE.WebGLRenderer({ canvas: viewCanvas, antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearAlpha(0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

scene.add(new THREE.AmbientLight(0xffffff, 0.66));
scene.add(new THREE.HemisphereLight(0xffffff, 0xc9ced5, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(8, 16, 6);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 1; key.shadow.camera.far = 48;
key.shadow.camera.left = -14; key.shadow.camera.right = 14;
key.shadow.camera.top = 14; key.shadow.camera.bottom = -14;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.34);
rim.position.set(-9, 5, -8);
scene.add(rim);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(90, 90).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.13 })
);
ground.receiveShadow = true;
scene.add(ground);

// polar stage grid — rings and 15° spokes
function polarGrid() {
  const pts = [];
  [2, 4, 6, 8, 10, 12].forEach(r => {
    const seg = 180;
    for (let i = 0; i < seg; i++) {
      const a0 = i / seg * Math.PI * 2, a1 = (i + 1) / seg * Math.PI * 2;
      pts.push(Math.cos(a0) * r, 0, Math.sin(a0) * r, Math.cos(a1) * r, 0, Math.sin(a1) * r);
    }
  });
  for (let d = 0; d < 360; d += 15) {
    const a = d * DEG;
    const inner = (d % 90 === 0) ? 0.4 : 2;
    pts.push(Math.cos(a) * inner, 0, Math.sin(a) * inner, Math.cos(a) * 12, 0, Math.sin(a) * 12);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({
    color: 0x8d949c, transparent: true, opacity: 0.30
  }));
}
const grid = polarGrid();
grid.position.y = 0.002;
scene.add(grid);

// reference solid
const block = new THREE.Mesh(
  new THREE.BoxGeometry(0.9, 1.8, 0.9),
  new THREE.MeshStandardMaterial({ color: 0xf7f8f9, roughness: 0.62, metalness: 0.04 })
);
block.position.set(-2.9, 0.9, 1.7);
block.castShadow = true;
scene.add(block);
const blockEdges = new THREE.LineSegments(
  new THREE.EdgesGeometry(block.geometry),
  new THREE.LineBasicMaterial({ color: 0x22262b, transparent: true, opacity: 0.22 })
);
blockEdges.position.copy(block.position);
scene.add(blockEdges);

/* ── the transformed surface ─────────────────────────────────────── */
const SIZE = 3.4;
const surface = new THREE.Group();
scene.add(surface);
const planeGeo = new THREE.PlaneGeometry(SIZE, SIZE).rotateX(-Math.PI / 2);

function ruleTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const x = c.getContext('2d');
  x.clearRect(0, 0, 512, 512);
  x.strokeStyle = 'rgba(34,38,43,0.13)';
  x.lineWidth = 1.4;
  for (let i = 32; i < 512; i += 32) {
    x.beginPath(); x.moveTo(i + .5, 0); x.lineTo(i + .5, 512); x.stroke();
    x.beginPath(); x.moveTo(0, i + .5); x.lineTo(512, i + .5); x.stroke();
  }
  x.strokeStyle = 'rgba(34,38,43,0.26)';
  x.lineWidth = 2.2;
  for (let i = 128; i < 512; i += 128) {
    x.beginPath(); x.moveTo(i + .5, 0); x.lineTo(i + .5, 512); x.stroke();
    x.beginPath(); x.moveTo(0, i + .5); x.lineTo(512, i + .5); x.stroke();
  }
  x.strokeStyle = 'rgba(34,38,43,0.86)';
  x.lineWidth = 6;
  x.strokeRect(3, 3, 506, 506);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 8;
  return t;
}
const faceMat = new THREE.MeshBasicMaterial({
  color: 0xffffff, transparent: true, opacity: 0.66, side: THREE.DoubleSide, depthWrite: false
});
const ruleMat = new THREE.MeshBasicMaterial({
  map: ruleTexture(), transparent: true, side: THREE.DoubleSide, depthWrite: false
});
surface.add(new THREE.Mesh(planeGeo, faceMat));
const rule = new THREE.Mesh(planeGeo, ruleMat);
rule.renderOrder = 2;
surface.add(rule);

// normal spindle: brass tip marks the face side
surface.add(new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0.66, 0)]),
  new THREE.LineBasicMaterial({ color: 0x22262b, transparent: true, opacity: 0.5 })
));
const spindle = new THREE.Mesh(
  new THREE.SphereGeometry(0.062, 18, 18),
  new THREE.MeshStandardMaterial({ color: 0xa8813c, roughness: 0.35, metalness: 0.55 })
);
spindle.position.y = 0.66;
surface.add(spindle);

// mirrored copies, for a polished-floor read
const mirror = new THREE.Group();
mirror.matrixAutoUpdate = false;
scene.add(mirror);
[[planeGeo, faceMat, 0.14], [planeGeo, ruleMat, 0.16]].forEach(([geo, mat, op]) => {
  const m = mat.clone();
  m.opacity = (mat.opacity !== undefined ? mat.opacity : 1) * op;
  m.transparent = true; m.depthWrite = false;
  mirror.add(new THREE.Mesh(geo, m));
});
const blockMirror = new THREE.Mesh(block.geometry, new THREE.MeshBasicMaterial({
  color: 0xdfe2e6, transparent: true, opacity: 0.16, depthWrite: false
}));
blockMirror.position.set(block.position.x, -block.position.y, block.position.z);
blockMirror.scale.y = -1;
scene.add(blockMirror);

// ground footprint: drop line + ring, so height is never ambiguous
const dropLine = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
  new THREE.LineBasicMaterial({ color: 0x22262b, transparent: true, opacity: 0.22 })
);
scene.add(dropLine);
const footprint = new THREE.Mesh(
  new THREE.RingGeometry(0.2, 0.235, 48).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x22262b, transparent: true, opacity: 0.26, side: THREE.DoubleSide })
);
footprint.position.y = 0.004;
scene.add(footprint);

/* ── state ───────────────────────────────────────────────────────── */
const obj = { pos: new THREE.Vector3(0, 1.1, 0), quat: new THREE.Quaternion() };
const cam = { radius: 11.5, theta: 0.8, phi: 1.04, target: new THREE.Vector3(0, 1.1, 0) };

function applyObject() {
  surface.position.copy(obj.pos);
  surface.quaternion.copy(obj.quat);
  surface.updateMatrixWorld(true);
  mirror.matrix.copy(new THREE.Matrix4().makeScale(1, -1, 1).multiply(surface.matrixWorld));
  mirror.visible = grid.visible && mirrorOn && obj.pos.y > 0.06;

  footprint.position.set(obj.pos.x, 0.004, obj.pos.z);
  footprint.visible = obj.pos.y > 0.06;
  dropLine.geometry.setFromPoints([
    new THREE.Vector3(obj.pos.x, 0.01, obj.pos.z),
    new THREE.Vector3(obj.pos.x, obj.pos.y, obj.pos.z)
  ]);
  dropLine.visible = footprint.visible;

  const e = new THREE.Euler().setFromQuaternion(obj.quat, 'YXZ');
  $('p-x').textContent = obj.pos.x.toFixed(2);
  $('p-y').textContent = obj.pos.y.toFixed(2);
  $('p-z').textContent = obj.pos.z.toFixed(2);
  $('r-x').textContent = Math.round(e.x / DEG) + '°';
  $('r-y').textContent = Math.round(e.y / DEG) + '°';
  $('r-z').textContent = Math.round(e.z / DEG) + '°';
  drawGizmo();
}
function applyCamera() {
  const sp = Math.sin(cam.phi), cp = Math.cos(cam.phi);
  const st = Math.sin(cam.theta), ct = Math.cos(cam.theta);
  camera.position.set(
    cam.target.x + cam.radius * sp * st,
    cam.target.y + cam.radius * cp,
    cam.target.z + cam.radius * sp * ct
  );
  camera.lookAt(cam.target);
  drawGizmo();
}

/* ══════════════════════════════════════════════════════════════════
   Gizmo
   ══════════════════════════════════════════════════════════════════ */
const gz = { size: 186, mode: 'move', snap: true, fine: false, active: null, hover: null, arc: null };
let mirrorOn = true;

const gzc = $('gz-canvas');
const gctx = gzc.getContext('2d');

const GRAPHITE = '#22262b', PEWTER = '#767d86', HAZE = '#aeb5bd', BRASS = '#a8813c';
const AXES = [
  { dir: [0, 1, 0], lbl: 'Y', tone: GRAPHITE, ink: '#ffffff' },
  { dir: [1, 0, 0], lbl: 'X', tone: PEWTER, ink: '#ffffff' },
  { dir: [0, 0, 1], lbl: 'Z', tone: '#c4c9cf', ink: GRAPHITE }
];

function gzMetrics() {
  const S = gz.size;
  return { S, c: S / 2, arm: S * 0.248, hand: S * 0.081, hub: S * 0.102, ring: S * 0.44 };
}
function sizeGizmo() {
  const dpr = Math.min(window.devicePixelRatio, 2);
  gzc.style.width = gz.size + 'px';
  gzc.style.height = gz.size + 'px';
  gzc.width = Math.round(gz.size * dpr);
  gzc.height = Math.round(gz.size * dpr);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const lens = $('lens');
  lens.style.width = gz.size + 'px';
  lens.style.height = gz.size + 'px';
  drawGizmo();
}

function axisDir(a) {
  const v = new THREE.Vector3(a.dir[0], a.dir[1], a.dir[2]);
  if (gz.mode !== 'look') v.applyQuaternion(obj.quat);
  return v.normalize();
}
function project(v) {
  const sp = Math.sin(cam.phi), cp = Math.cos(cam.phi);
  const st = Math.sin(cam.theta), ct = Math.cos(cam.theta);
  const sx = v.x * ct + v.z * -st;
  const sy = v.x * (-cp * st) + v.y * sp + v.z * (-cp * ct);
  const depth = v.x * (sp * st) + v.y * cp + v.z * (sp * ct);
  const m = gzMetrics();
  return { x: m.c + sx * m.arm, y: m.c - sy * m.arm, depth, len: Math.hypot(sx, sy) };
}
function handles() {
  const out = [];
  AXES.forEach((a, i) => {
    const d = axisDir(a);
    out.push({ a, i, sign: 1, dir: d, p: project(d) });
    const n = d.clone().negate();
    out.push({ a, i, sign: -1, dir: n, p: project(n) });
  });
  return out;
}

function drawGizmo() {
  const m = gzMetrics();
  const g = gctx;
  g.clearRect(0, 0, m.S, m.S);

  drawBezel(g, m);

  const hs = handles().sort((p, q) => p.p.depth - q.p.depth);

  hs.forEach(h => {
    const front = h.p.depth >= -0.04;
    g.save();
    g.beginPath();
    g.moveTo(m.c, m.c);
    g.lineTo(h.p.x, h.p.y);
    if (h.sign > 0 && front) { g.strokeStyle = h.a.tone; g.lineWidth = 1.9; }
    else { g.strokeStyle = 'rgba(34,38,43,0.16)'; g.lineWidth = 1; g.setLineDash([2, 3]); }
    g.stroke();
    g.restore();
  });

  hs.forEach(h => {
    const front = h.p.depth >= -0.04;
    const on = gz.active && gz.active.type === 'axis' && gz.active.i === h.i && gz.active.sign === h.sign;
    const hov = gz.hover && gz.hover.i === h.i && gz.hover.sign === h.sign;

    if (h.sign < 0 || !front) {
      g.beginPath();
      g.arc(h.p.x, h.p.y, m.hand * (h.sign < 0 ? 0.56 : 0.72), 0, Math.PI * 2);
      g.fillStyle = on ? BRASS : (hov ? 'rgba(34,38,43,0.40)' : 'rgba(34,38,43,0.18)');
      g.fill();
      return;
    }

    if (h.p.len > (gz.mode === 'rotate' ? 0.34 : 0.2)) {
      const ux = (h.p.x - m.c) / (m.arm * h.p.len), uy = (h.p.y - m.c) / (m.arm * h.p.len);
      g.save();
      g.translate(h.p.x, h.p.y);
      g.rotate(Math.atan2(uy, ux));
      const tint = on ? BRASS : h.a.tone;
      g.fillStyle = tint; g.strokeStyle = tint;
      if (gz.mode === 'rotate') {
        g.lineWidth = 1.8;
        g.beginPath();
        g.arc(0, 0, m.hand * 1.46, -0.92, 0.92);
        g.stroke();
        const ax = Math.cos(0.92) * m.hand * 1.46, ay = Math.sin(0.92) * m.hand * 1.46;
        g.beginPath();
        g.moveTo(ax + 3.2, ay + 1); g.lineTo(ax - 2.5, ay + 3.3); g.lineTo(ax - 1, ay - 2.6);
        g.closePath(); g.fill();
      } else {
        const base = m.hand * 1.06, wide = m.hand * 0.5;
        g.beginPath();
        g.moveTo(base + m.hand * 1.06, 0);
        g.lineTo(base, -wide);
        g.lineTo(base, wide);
        g.closePath();
        g.fill();
      }
      g.restore();
    }

    g.save();
    g.shadowColor = 'rgba(34,38,43,0.22)';
    g.shadowBlur = 6;
    g.shadowOffsetY = 1.5;
    g.beginPath();
    g.arc(h.p.x, h.p.y, m.hand * (on || hov ? 1.08 : 1), 0, Math.PI * 2);
    g.fillStyle = on ? BRASS : h.a.tone;
    g.fill();
    g.restore();
    if (hov && !on) {
      g.strokeStyle = 'rgba(34,38,43,0.55)';
      g.lineWidth = 1;
      g.beginPath();
      g.arc(h.p.x, h.p.y, m.hand * 1.4, 0, Math.PI * 2);
      g.stroke();
    }
    g.fillStyle = on ? '#ffffff' : h.a.ink;
    g.font = '400 ' + (m.hand * 1.02).toFixed(1) + 'px ' + getComputedStyle(document.body).fontFamily;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(h.a.lbl, h.p.x, h.p.y + 0.5);
  });

  // hub
  g.save();
  g.shadowColor = 'rgba(34,38,43,0.18)';
  g.shadowBlur = 8;
  g.shadowOffsetY = 2;
  g.beginPath();
  g.arc(m.c, m.c, m.hub, 0, Math.PI * 2);
  g.fillStyle = 'rgba(255,255,255,0.94)';
  g.fill();
  g.restore();
  g.strokeStyle = gz.active && gz.active.type === 'hub' ? GRAPHITE : 'rgba(34,38,43,0.34)';
  g.lineWidth = 1;
  g.stroke();
  drawHubIcon(g, m.c, m.c, m.hub * 0.6);
}

// engraved bezel: 15° ticks, quadrant marks, live arc while rotating
function drawBezel(g, m) {
  g.save();
  g.strokeStyle = 'rgba(34,38,43,0.13)';
  g.lineWidth = 1;
  g.beginPath();
  g.arc(m.c, m.c, m.ring, 0, Math.PI * 2);
  g.stroke();

  for (let d = 0; d < 360; d += 15) {
    const a = d * DEG;
    const major = d % 90 === 0;
    const len = major ? 7 : 4;
    const lit = gz.arc && Math.abs(shortAngle(gz.arc.value - d)) < 7.5;
    g.strokeStyle = lit ? BRASS : (major ? 'rgba(34,38,43,0.34)' : 'rgba(34,38,43,0.17)');
    g.lineWidth = lit ? 1.8 : (major ? 1.2 : 1);
    g.beginPath();
    g.moveTo(m.c + Math.cos(a) * (m.ring - len), m.c + Math.sin(a) * (m.ring - len));
    g.lineTo(m.c + Math.cos(a) * m.ring, m.c + Math.sin(a) * m.ring);
    g.stroke();
  }

  if (gz.arc) {
    g.strokeStyle = BRASS;
    g.lineWidth = 2.4;
    g.beginPath();
    g.arc(m.c, m.c, m.ring - 11, gz.arc.from, gz.arc.from + gz.arc.delta, gz.arc.delta < 0);
    g.stroke();
  }
  g.restore();
}
function shortAngle(d) { let a = d % 360; if (a > 180) a -= 360; if (a < -180) a += 360; return a; }

function drawHubIcon(g, cx, cy, r) {
  g.save();
  g.strokeStyle = GRAPHITE;
  g.fillStyle = GRAPHITE;
  g.lineWidth = 1.1;
  if (gz.mode === 'move') {
    for (let k = 0; k < 4; k++) {
      g.save();
      g.translate(cx, cy);
      g.rotate(k * Math.PI / 2);
      g.beginPath(); g.moveTo(0, 0); g.lineTo(r * 0.84, 0); g.stroke();
      g.beginPath();
      g.moveTo(r, 0); g.lineTo(r * 0.62, -r * 0.3); g.lineTo(r * 0.62, r * 0.3);
      g.closePath(); g.fill();
      g.restore();
    }
  } else if (gz.mode === 'rotate') {
    g.beginPath();
    g.arc(cx, cy, r * 0.8, -2.5, 1.7);
    g.stroke();
    const ax = cx + Math.cos(1.7) * r * 0.8, ay = cy + Math.sin(1.7) * r * 0.8;
    g.beginPath();
    g.moveTo(ax + 3.2, ay - 0.4); g.lineTo(ax - 1.3, ay + 3.2); g.lineTo(ax - 2.4, ay - 2.3);
    g.closePath(); g.fill();
  } else {
    g.beginPath(); g.arc(cx, cy, r * 0.32, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(cx, cy, r * 0.88, 0, Math.PI * 2); g.stroke();
  }
  g.restore();
}

/* ══════════════════════════════════════════════════════════════════
   Input
   ══════════════════════════════════════════════════════════════════ */
function gzPoint(e) {
  const r = gzc.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (gz.size / r.width), y: (e.clientY - r.top) * (gz.size / r.height) };
}
function pickHandle(pt) {
  const m = gzMetrics();
  const near = [];
  handles().forEach(h => {
    const d = Math.hypot(pt.x - h.p.x, pt.y - h.p.y);
    if (d < m.hand * (h.sign > 0 ? 1.85 : 1.5)) near.push({ h, d, front: h.p.depth >= -0.04 });
  });
  if (!near.length) return null;
  near.sort((a, b) => a.d - b.d);
  // the closest handle wins; a front one only steals it on a near tie
  const tie = near.find(c => c.front && c.d <= near[0].d + m.hand * 0.4);
  return (tie || near[0]).h;
}
function unitsPerPixel() { return (2 * cam.radius * Math.tan(FOV * DEG / 2)) / H; }
function camBasis() {
  const sp = Math.sin(cam.phi), cp = Math.cos(cam.phi);
  const st = Math.sin(cam.theta), ct = Math.cos(cam.theta);
  return {
    right: new THREE.Vector3(ct, 0, -st),
    up: new THREE.Vector3(-cp * st, sp, -cp * ct)
  };
}

const past = [], future = [];
function snapshot() { return { p: obj.pos.clone(), q: obj.quat.clone() }; }
function pushHistory() {
  past.push(snapshot());
  if (past.length > 60) past.shift();
  future.length = 0;
  syncHistoryButtons();
}
function syncHistoryButtons() {
  $('b-undo').disabled = past.length === 0;
  $('b-redo').disabled = future.length === 0;
}
function undo() {
  const s = past.pop();
  if (!s) return;
  future.push(snapshot());
  obj.pos.copy(s.p); obj.quat.copy(s.q);
  applyObject(); syncHistoryButtons(); chip('History', 'undo');
}
function redo() {
  const s = future.pop();
  if (!s) return;
  past.push(snapshot());
  obj.pos.copy(s.p); obj.quat.copy(s.q);
  applyObject(); syncHistoryButtons(); chip('History', 'redo');
}

let chipTimer = null;
function chip(k, v, sticky) {
  const el = $('chip');
  el.innerHTML = '<span class="k">' + k + '</span>' + v;
  el.classList.add('on');
  if (chipTimer) clearTimeout(chipTimer);
  if (!sticky) chipTimer = setTimeout(() => el.classList.remove('on'), 1500);
}
function chipOff() {
  if (chipTimer) clearTimeout(chipTimer);
  chipTimer = setTimeout(() => $('chip').classList.remove('on'), 900);
}
function signed(v, digits) { return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(digits === undefined ? 2 : digits); }

let drag = null;
gzc.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const pt = gzPoint(e);
  const m = gzMetrics();
  const r = Math.hypot(pt.x - m.c, pt.y - m.c);
  const hit = pickHandle(pt);

  if (hit) gz.active = { type: 'axis', i: hit.i, sign: hit.sign };
  else if (r <= m.hub * 1.25 && gz.mode !== 'look') gz.active = { type: 'hub' };
  else gz.active = { type: 'orbit' };

  drag = {
    startX: e.clientX, startY: e.clientY, moved: false, hit,
    pos: obj.pos.clone(), quat: obj.quat.clone(),
    theta: cam.theta, phi: cam.phi,
    startAngle: Math.atan2(pt.y - m.c, pt.x - m.c),
    committed: false
  };
  gzc.setPointerCapture(e.pointerId);
  drawGizmo();
});

gzc.addEventListener('pointermove', (e) => {
  if (!drag) {
    const hit = pickHandle(gzPoint(e));
    const changed = (hit ? hit.i + ':' + hit.sign : '') !== (gz.hover ? gz.hover.i + ':' + gz.hover.sign : '');
    gz.hover = hit ? { i: hit.i, sign: hit.sign } : null;
    gzc.style.cursor = hit ? 'pointer' : 'grab';
    if (changed) drawGizmo();
    return;
  }

  const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
  if (!drag.moved && Math.hypot(dx, dy) < 3.5) return;
  drag.moved = true;

  const fine = gz.fine || e.shiftKey;
  const gain = fine ? 0.22 : 1;
  const snapping = gz.snap && !fine;
  const act = gz.active;

  if (act.type === 'orbit' || (act.type === 'axis' && gz.mode === 'look')) {
    cam.theta = drag.theta - dx * 0.006 * gain;
    cam.phi = Math.max(0.06, Math.min(Math.PI - 0.06, drag.phi - dy * 0.006 * gain));
    applyCamera();
    chip('Orbit', Math.round(((-cam.theta / DEG) % 360 + 360) % 360) + '° · ' + Math.round(90 - cam.phi / DEG) + '°', true);
    return;
  }

  if (!drag.committed) { pushHistory(); drag.committed = true; }

  if (act.type === 'hub') {
    if (gz.mode === 'move') {
      const b = camBasis(), k = unitsPerPixel() * gain;
      obj.pos.copy(drag.pos).addScaledVector(b.right, dx * k).addScaledVector(b.up, -dy * k);
      if (snapping) { obj.pos.x = snapTo(obj.pos.x, 0.25); obj.pos.y = snapTo(obj.pos.y, 0.25); obj.pos.z = snapTo(obj.pos.z, 0.25); }
      clampPos();
      applyObject();
      chip('Screen', obj.pos.x.toFixed(2) + '  ' + obj.pos.y.toFixed(2) + '  ' + obj.pos.z.toFixed(2), true);
    } else {
      const b = camBasis();
      let ay = -dx * 0.5 * gain, ax = -dy * 0.5 * gain;
      if (snapping) { ay = snapTo(ay, 15); ax = snapTo(ax, 15); }
      const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), ay * DEG)
        .multiply(new THREE.Quaternion().setFromAxisAngle(b.right, ax * DEG));
      obj.quat.copy(drag.quat).premultiply(q);
      applyObject();
      chip('Trackball', Math.round(ay) + '°  ' + Math.round(ax) + '°', true);
    }
    return;
  }

  const h = drag.hit;
  const a = AXES[h.i];
  const worldDir = h.dir;
  const p = project(worldDir);
  const m = gzMetrics();

  if (gz.mode === 'move') {
    const len = Math.max(0.001, p.len);
    const nx = (p.x - m.c) / (m.arm * len);
    const ny = (p.y - m.c) / (m.arm * len);
    const along = dx * nx + dy * ny;
    let amount = along * unitsPerPixel() * gain / Math.max(0.30, len);
    if (snapping) amount = snapTo(amount, 0.25);
    obj.pos.copy(drag.pos).addScaledVector(worldDir, amount);
    clampPos();
    applyObject();
    chip((h.sign > 0 ? '' : '−') + a.lbl + ' axis', signed(amount) + ' m', true);
  } else {
    const pt = gzPoint(e);
    let d = Math.atan2(pt.y - m.c, pt.x - m.c) - drag.startAngle;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    let deg = -(d / DEG) * (p.depth >= 0 ? 1 : -1) * gain;
    if (snapping) deg = snapTo(deg, 15);
    const q = new THREE.Quaternion().setFromAxisAngle(worldDir, deg * DEG);
    obj.quat.copy(drag.quat).premultiply(q);
    const shown = -deg * (p.depth >= 0 ? 1 : -1);
    gz.arc = { from: drag.startAngle, delta: shown * DEG, value: ((drag.startAngle / DEG + shown) % 360 + 360) % 360 };
    applyObject();
    chip((h.sign > 0 ? '' : '−') + a.lbl + ' spin', signed(deg, 0) + '°', true);
  }
});

function endDrag(e) {
  if (!drag) return;
  if (!drag.moved && drag.hit) {
    faceDirection(drag.hit.dir);
    chip('View', (drag.hit.sign > 0 ? '' : '−') + drag.hit.a.lbl + ' axis');
  } else if (!drag.moved && gz.active && gz.active.type === 'hub') {
    setMode(gz.mode === 'move' ? 'rotate' : 'move');
  } else chipOff();
  gz.active = null;
  gz.arc = null;
  drag = null;
  try { gzc.releasePointerCapture(e.pointerId); } catch (_) {}
  drawGizmo();
  syncHistoryButtons();
}
gzc.addEventListener('pointerup', endDrag);
gzc.addEventListener('pointercancel', endDrag);

function snapTo(v, step) { return Math.round(v / step) * step; }
function clampPos() {
  obj.pos.x = Math.max(-12, Math.min(12, obj.pos.x));
  obj.pos.y = Math.max(-3, Math.min(9, obj.pos.y));
  obj.pos.z = Math.max(-12, Math.min(12, obj.pos.z));
}

/* ── camera flight ───────────────────────────────────────────────── */
let flight = null;
function faceDirection(dir) {
  const d = dir.clone().normalize();
  const theta = Math.atan2(d.x, d.z);
  const phi = Math.acos(Math.max(-1, Math.min(1, d.y)));
  flyTo(phi, Math.max(0.001, Math.min(Math.PI - 0.001, theta)));
  if (navigator.vibrate) { try { navigator.vibrate(7); } catch (_) {} }
}
function flyTo(phi, theta, ms) {
  let t = theta;
  while (t - cam.theta > Math.PI) t -= Math.PI * 2;
  while (t - cam.theta < -Math.PI) t += Math.PI * 2;
  const targetPhi = Math.max(0.06, Math.min(Math.PI - 0.06, phi));
  if (reduceMotion) { cam.phi = targetPhi; cam.theta = t; applyCamera(); return; }
  flight = { p0: cam.phi, t0: cam.theta, p1: targetPhi, t1: t, start: performance.now(), ms: ms || 480 };
}
function stepFlight(now) {
  if (!flight) return;
  const k = Math.min(1, (now - flight.start) / flight.ms);
  const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  cam.phi = flight.p0 + (flight.p1 - flight.p0) * e;
  cam.theta = flight.t0 + (flight.t1 - flight.t0) * e;
  applyCamera();
  if (k >= 1) flight = null;
}

/* ══════════════════════════════════════════════════════════════════
   Viewport
   ══════════════════════════════════════════════════════════════════ */
const pointers = new Map();
let vp = null;
viewCanvas.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  viewCanvas.setPointerCapture(e.pointerId);
  if (pointers.size === 1) {
    vp = { mode: (e.button === 2 || e.shiftKey) ? 'pan' : 'orbit', x: e.clientX, y: e.clientY, theta: cam.theta, phi: cam.phi, target: cam.target.clone() };
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    vp = { mode: 'pinch', dist: Math.hypot(a.x - b.x, a.y - b.y), radius: cam.radius, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, target: cam.target.clone() };
  }
});
viewCanvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!vp) return;
  flight = null;
  if (vp.mode === 'pinch' && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    cam.radius = Math.max(2.5, Math.min(46, vp.radius * (vp.dist / Math.max(1, dist))));
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    panBy(cx - vp.cx, cy - vp.cy, vp.target);
    applyCamera();
    return;
  }
  const dx = e.clientX - vp.x, dy = e.clientY - vp.y;
  if (vp.mode === 'orbit') {
    cam.theta = vp.theta - dx * 0.0042;
    cam.phi = Math.max(0.06, Math.min(Math.PI - 0.06, vp.phi - dy * 0.0042));
  } else {
    panBy(dx, dy, vp.target);
  }
  applyCamera();
});
function panBy(dx, dy, base) {
  const b = camBasis(), k = unitsPerPixel();
  cam.target.copy(base).addScaledVector(b.right, -dx * k).addScaledVector(b.up, dy * k);
}
function clearPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) vp = null;
  try { viewCanvas.releasePointerCapture(e.pointerId); } catch (_) {}
}
viewCanvas.addEventListener('pointerup', clearPointer);
viewCanvas.addEventListener('pointercancel', clearPointer);
viewCanvas.addEventListener('contextmenu', (e) => e.preventDefault());
viewCanvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  cam.radius = Math.max(2.5, Math.min(46, cam.radius * (e.deltaY > 0 ? 1.07 : 0.93)));
  applyCamera();
}, { passive: false });

/* ══════════════════════════════════════════════════════════════════
   Console
   ══════════════════════════════════════════════════════════════════ */
function setMode(mode) {
  gz.mode = mode;
  [['m-move', 'move'], ['m-rot', 'rotate'], ['m-look', 'look']].forEach(([id, v]) => {
    $(id).setAttribute('aria-pressed', String(mode === v));
  });
  positionSlider();
  drawGizmo();
}
function positionSlider() {
  const active = document.querySelector('.m[aria-pressed="true"]');
  const s = $('slider');
  if (!active) return;
  s.style.width = active.offsetWidth + 'px';
  s.style.transform = 'translateX(' + (active.offsetLeft - 3) + 'px)';
}
$('m-move').onclick = () => setMode('move');
$('m-rot').onclick = () => setMode('rotate');
$('m-look').onclick = () => setMode('look');

function setOrient(pitchDeg, rollDeg, label) {
  pushHistory();
  const e = new THREE.Euler().setFromQuaternion(obj.quat, 'YXZ');
  obj.quat.setFromEuler(new THREE.Euler(pitchDeg * DEG, e.y, rollDeg * DEG, 'YXZ'));
  applyObject();
  chip('Preset', label);
}
$('b-flat').onclick = () => setOrient(0, 0, 'flat');
$('b-wall').onclick = () => setOrient(90, 0, 'upright');
$('b-45').onclick = () => setOrient(45, 0, '45°');
$('b-face').onclick = () => {
  const n = new THREE.Vector3(0, 1, 0).applyQuaternion(obj.quat);
  cam.target.copy(obj.pos);
  faceDirection(n);
  chip('View', 'surface normal');
};
$('b-snap').onclick = () => {
  gz.snap = !gz.snap;
  $('b-snap').setAttribute('aria-pressed', String(gz.snap));
  chip('Snap', gz.snap ? '0.25 m · 15°' : 'off');
};
$('b-fine').onclick = () => {
  gz.fine = !gz.fine;
  $('b-fine').setAttribute('aria-pressed', String(gz.fine));
  chip('Fine', gz.fine ? 'on · snap paused' : 'off');
};
$('b-undo').onclick = undo;
$('b-redo').onclick = redo;
$('b-reset').onclick = () => {
  pushHistory();
  obj.pos.set(0, 1.1, 0);
  obj.quat.identity();
  cam.target.set(0, 1.1, 0);
  applyObject();
  applyCamera();
  chip('Surface', 'reset');
};
$('u-grid').onclick = () => {
  grid.visible = !grid.visible;
  $('u-grid').setAttribute('aria-pressed', String(grid.visible));
  applyObject();
};
$('u-mirror').onclick = () => {
  mirrorOn = !mirrorOn;
  blockMirror.visible = mirrorOn;
  $('u-mirror').setAttribute('aria-pressed', String(mirrorOn));
  applyObject();
};
$('u-save').onclick = () => {
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'navigator-instrument.html';
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 800);

/* ── reposition the instrument ───────────────────────────────────── */
(() => {
  const el = $('gizmo'), grip = $('grip');
  let g = null;
  grip.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const r = el.getBoundingClientRect();
    g = { x: e.clientX, y: e.clientY, left: r.left, top: r.top };
    el.classList.add('dragging');
    grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener('pointermove', (e) => {
    if (!g) return;
    el.style.left = Math.max(6, Math.min(window.innerWidth - el.offsetWidth - 6, g.left + e.clientX - g.x)) + 'px';
    el.style.top = Math.max(40, Math.min(window.innerHeight - el.offsetHeight - 6, g.top + e.clientY - g.y)) + 'px';
    el.style.right = 'auto';
    el.style.bottom = 'auto';
  });
  grip.addEventListener('pointerup', (e) => {
    g = null;
    el.classList.remove('dragging');
    try { grip.releasePointerCapture(e.pointerId); } catch (_) {}
  });
})();

/* ── keys ────────────────────────────────────────────────────────── */
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'g') setMode('move');
  else if (k === 'r') setMode('rotate');
  else if (k === 'l') setMode('look');
  else if (k === 'f') $('b-face').click();
  else if (k === 's') $('b-snap').click();
  else if (k === 'x') $('b-fine').click();
  else if (k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (k === '0') $('b-reset').click();
  else if (k.startsWith('arrow')) {
    e.preventDefault();
    pushHistory();
    const step = e.shiftKey ? 1 : 0.25;
    const b = camBasis();
    const axis = (k === 'arrowleft' || k === 'arrowright') ? b.right : b.up;
    const s = (k === 'arrowright' || k === 'arrowup') ? step : -step;
    obj.pos.addScaledVector(axis, s);
    clampPos();
    applyObject();
    chip('Nudge', signed(s) + ' m');
  }
});

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  renderer.setSize(W, H);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  applyCamera();
  positionSlider();
});

function loop(now) {
  requestAnimationFrame(loop);
  stepFlight(now);
  renderer.render(scene, camera);
}

sizeGizmo();
applyObject();
applyCamera();
positionSlider();
syncHistoryButtons();
requestAnimationFrame(loop);
document.fonts && document.fonts.ready.then(() => { positionSlider(); drawGizmo(); });
setTimeout(() => $('legend').classList.add('gone'), 6000);
</script>
</body>
</html>
