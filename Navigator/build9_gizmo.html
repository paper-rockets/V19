<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Navigator · build 9 · free gizmo</title>
<script src="/js/three.min.js"></script>
<script>if (typeof THREE === "undefined") document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<style>
/* ══════════════════════════════════════════════════════════════════
   DEMO HOST — stands in for Drawing Canvas. Delete this block and the
   four .host divs in the body when you paste the dock into your app.
   ══════════════════════════════════════════════════════════════════ */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;touch-action:none;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #view{position:fixed;inset:0;display:block;touch-action:none;z-index:1}
  .host{position:fixed;z-index:40;color:#6b645a}
  #host-top{top:0;left:0;right:0;height:54px;display:flex;align-items:center;gap:20px;padding:0 16px;
    background:var(--host-bar);border-bottom:1px solid var(--host-line);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    font-size:15px;font-weight:600;color:var(--host-ink)}
  #host-top .ic{font-weight:400;font-size:17px;color:var(--host-dim);cursor:pointer}
  #host-rail{left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:26px;
    font-size:19px;color:var(--host-dim)}
  #host-rail .dot{width:30px;height:30px;border-radius:15px;background:#35a7e8}
  #host-fps{right:14px;bottom:8px;font-size:12px;color:var(--host-dim)}
  #host-fps i{font-style:normal;color:#22c55e}
  html{--host-bar:rgba(250,247,242,.8);--host-line:rgba(51,46,40,.10);--host-ink:#332e28;--host-dim:#8a8177}
  html[data-nv-theme="dark"]{--host-bar:rgba(24,23,21,.82);--host-line:rgba(255,255,255,.10);
    --host-ink:#f0ebe4;--host-dim:#8d867d}

/* ══════════════════════════════════════════════════════════════════
   NAVIGATOR — the gizmo floats free; everything else hides behind
   the ⋯ tab and flies out toward the middle of the screen.
   Theme follows the system, or force it:
     document.documentElement.dataset.nvTheme = 'dark' | 'light'
   Keep it clear of your chrome with the four inset vars.
   ══════════════════════════════════════════════════════════════════ */
  html{
    --nv-top:62px; --nv-right:8px; --nv-bottom:30px; --nv-left:62px; --nv-gap:10px;

    --nv-panel:rgba(252,250,247,.86);
    --nv-ink:#332e28;
    --nv-ink-60:rgba(51,46,40,.62);
    --nv-ink-35:rgba(51,46,40,.36);
    --nv-line:rgba(51,46,40,.13);
    --nv-edge:rgba(255,255,255,.75);
    --nv-btn:rgba(255,255,255,.62);
    --nv-btn-on:#ffffff;
    --nv-shadow:0 14px 34px rgba(51,46,40,.20);
    --nv-halo:rgba(255,255,255,.85);
    --nv-up:#e0822a; --nv-side:#2f80c4; --nv-front:#3f9a62;
    --nv-ghost:rgba(51,46,40,.26);
    --nv-hub:rgba(255,255,255,.96);
  }
  @media (prefers-color-scheme:dark){
    html:not([data-nv-theme="light"]){
      --nv-panel:rgba(32,30,28,.86);
      --nv-ink:#f2ede6;
      --nv-ink-60:rgba(242,237,230,.66);
      --nv-ink-35:rgba(242,237,230,.40);
      --nv-line:rgba(255,255,255,.14);
      --nv-edge:rgba(255,255,255,.14);
      --nv-btn:rgba(255,255,255,.07);
      --nv-btn-on:rgba(255,255,255,.16);
      --nv-shadow:0 14px 34px rgba(0,0,0,.5);
      --nv-halo:rgba(0,0,0,.6);
      --nv-up:#f0a154; --nv-side:#63a9e4; --nv-front:#5cba84;
      --nv-ghost:rgba(242,237,230,.32);
      --nv-hub:rgba(46,44,41,.96);
    }
  }
  html[data-nv-theme="dark"]{
    --nv-panel:rgba(32,30,28,.86);
    --nv-ink:#f2ede6;
    --nv-ink-60:rgba(242,237,230,.66);
    --nv-ink-35:rgba(242,237,230,.40);
    --nv-line:rgba(255,255,255,.14);
    --nv-edge:rgba(255,255,255,.14);
    --nv-btn:rgba(255,255,255,.07);
    --nv-btn-on:rgba(255,255,255,.16);
    --nv-shadow:0 14px 34px rgba(0,0,0,.5);
    --nv-halo:rgba(0,0,0,.6);
    --nv-up:#f0a154; --nv-side:#63a9e4; --nv-front:#5cba84;
    --nv-ghost:rgba(242,237,230,.32);
    --nv-hub:rgba(46,44,41,.96);
  }

  #nv{position:fixed;inset:0;z-index:50;pointer-events:none;color:var(--nv-ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums}
  #nv > *{pointer-events:auto}
  #nv.nv-dim{opacity:.18;transition:opacity .12s ease}
  #nv:not(.nv-dim){transition:opacity .3s ease .2s}

  /* ── the gizmo itself: no panel, no background ── */
  .nv-dock{position:absolute;pointer-events:none}
  .nv-dock > *{pointer-events:auto}
  .nv-canvas{display:block;cursor:grab;touch-action:none;transform-origin:50% 50%;
    transition:transform .2s cubic-bezier(.32,.72,0,1)}
  #nv.nv-grabbing .nv-canvas{cursor:grabbing}
  #nv.nv-focus .nv-canvas{transform:scale(1.14)}
  #nv.nv-focus .nv-tab{opacity:0;pointer-events:none}
  #nv.nv-covered .nv-canvas,#nv.nv-covered .nv-label{opacity:.22;transition:opacity .18s ease}

  .nv-label{text-align:center;font-size:12px;color:var(--nv-ink-60);
    text-shadow:0 1px 2px var(--nv-halo),0 0 6px var(--nv-halo);pointer-events:none;
    min-height:18px;line-height:18px;margin-top:1px}
  /* the camera needs no label — in Look the gizmo is the whole tool */
  #nv[data-mode="look"] .nv-label{display:none}
  .nv-label b{color:var(--nv-ink);font-weight:600}
  .nv-label.nv-live{color:var(--nv-ink);font-weight:600}

  .nv-tab{position:absolute;top:0;right:0;width:28px;height:28px;border-radius:14px;padding:0;
    cursor:pointer;font:inherit;font-size:14px;line-height:1;color:var(--nv-ink-60);
    background:var(--nv-panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid var(--nv-edge);box-shadow:0 4px 14px rgba(51,46,40,.14);
    transition:opacity .18s ease,color .18s ease;touch-action:none}
  .nv-tab:hover{color:var(--nv-ink)}
  .nv-tab[aria-expanded="true"]{color:var(--nv-ink);border-color:var(--nv-ink)}

  /* ── everything else lives here, closed by default ── */
  .nv-menu{position:absolute;width:198px;padding:8px;border-radius:14px;display:none;
    max-height:min(78vh,520px);overflow-y:auto;
    background:var(--nv-panel);-webkit-backdrop-filter:blur(20px) saturate(1.1);
    backdrop-filter:blur(20px) saturate(1.1);border:1px solid var(--nv-edge);box-shadow:var(--nv-shadow)}
  #nv[data-menu="open"] .nv-menu{display:block}
  .nv-sec{font-size:10.5px;letter-spacing:.03em;color:var(--nv-ink-35);margin:8px 2px 4px}
  .nv-sec:first-child{margin-top:2px}

  .nv-pick{display:flex;align-items:center;gap:6px;width:100%;font:inherit;font-size:12.5px;
    line-height:1;padding:9px;border-radius:10px;cursor:pointer;text-align:left;
    color:var(--nv-ink);background:var(--nv-btn);border:1px solid var(--nv-line);min-height:34px}
  .nv-pick b{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nv-pick span{color:var(--nv-ink-35)}
  .nv-pick[aria-expanded="true"]{border-color:var(--nv-ink)}
  #nv-list{display:none;margin-top:3px}
  #nv-list.nv-on{display:block}
  .nv-opt{display:flex;align-items:center;gap:7px;width:100%;font:inherit;font-size:12.5px;line-height:1.2;
    padding:9px 8px;border:0;border-radius:9px;background:none;color:var(--nv-ink);cursor:pointer;text-align:left}
  .nv-opt:hover{background:var(--nv-btn)}
  .nv-opt[aria-selected="true"]{background:var(--nv-btn-on);font-weight:600}
  .nv-opt em{font-style:normal;color:var(--nv-ink-35);font-size:11px}
  .nv-swatch{width:8px;height:8px;border-radius:3px;background:var(--nv-ink-35);flex:0 0 auto}
  .nv-opt[aria-selected="true"] .nv-swatch{background:var(--nv-up)}

  .nv-modes,.nv-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .nv-chips{grid-template-columns:repeat(4,1fr)}
  .nv-mode,.nv-chip,.nv-act{font:inherit;font-size:11.5px;line-height:1.15;padding:8px 3px;cursor:pointer;
    border-radius:9px;color:var(--nv-ink);background:var(--nv-btn);border:1px solid var(--nv-line);
    min-height:33px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nv-mode[aria-pressed="true"],.nv-chip[aria-pressed="true"]{background:var(--nv-btn-on);
    border-color:var(--nv-ink);font-weight:600}
  .nv-acts{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
  .nv-act:disabled{opacity:.32;cursor:default}
  .nv-wide{width:100%;margin-top:6px;color:var(--nv-ink-60)}
  .nv-mode:focus-visible,.nv-chip:focus-visible,.nv-act:focus-visible,
  .nv-opt:focus-visible,.nv-tab:focus-visible{outline:2px solid var(--nv-ink);outline-offset:1px}

  @media (prefers-reduced-motion:reduce){
    .nv-canvas,.nv-tab{transition:none}
    #nv.nv-focus .nv-canvas{transform:none}
  }
</style>
</head>
<body>

<canvas id="view"></canvas>

<!-- demo host chrome -->
<div class="host" id="host-top">
  <span>Drawing Canvas</span>
  <span class="ic">↶</span><span class="ic">↷</span><span class="ic">▤</span>
  <span class="ic" id="host-grid" title="Grid">▦</span>
  <span class="ic" id="host-theme" title="Toggle theme">☀</span><span class="ic">⚙</span>
</div>
<div class="host" id="host-rail">
  <span>➤</span><span>✎</span><span>◻</span><span>✳</span><span>▤</span><span class="dot"></span>
</div>
<div class="host" id="host-fps"><i>●</i> 60 FPS</div>

<!-- ── the whole tool: one element ── -->
<div id="nv" data-menu="closed" data-corner="br">
  <div class="nv-dock" id="nv-dock">
    <canvas class="nv-canvas" id="nv-canvas"></canvas>
    <button class="nv-tab" id="nv-tab" aria-expanded="false" title="Menu · drag to move">⋯</button>
    <div class="nv-label" id="nv-label"></div>
  </div>

  <div class="nv-menu" id="nv-menu">
    <div class="nv-sec">Mode</div>
    <div class="nv-modes">
      <button class="nv-mode" id="nv-look" aria-pressed="true">Look</button>
      <button class="nv-mode" id="nv-move" aria-pressed="false">Move</button>
      <button class="nv-mode" id="nv-turn" aria-pressed="false">Turn</button>
    </div>
    <div class="nv-sec">Turning steps</div>
    <div class="nv-chips" id="nv-rot-steps"></div>
    <div class="nv-sec">Sliding steps</div>
    <div class="nv-chips" id="nv-move-steps"></div>
    <div class="nv-sec">Set it</div>
    <div class="nv-acts">
      <button class="nv-act" id="nv-flat">Lay flat</button>
      <button class="nv-act" id="nv-wall">Stand up</button>
      <button class="nv-act" id="nv-lean">Lean</button>
      <button class="nv-act" id="nv-face">Look at it</button>
      <button class="nv-act" id="nv-undo" disabled>Undo</button>
      <button class="nv-act" id="nv-reset">Start over</button>
    </div>
    <button class="nv-act nv-wide" id="nv-tour">Show me how</button>
    <div class="nv-sec">Moving</div>
    <button class="nv-pick" id="nv-pick" aria-expanded="false">
      <b id="nv-pick-name">Canvas</b><span>▾</span>
    </button>
    <div id="nv-list" role="listbox"></div>
    <div class="nv-sec" style="text-align:center;margin:8px 0 0">build 9</div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const DEG = Math.PI / 180;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const root = document.documentElement;

const viewCanvas = $('view');
const scene = new THREE.Scene();
let W = window.innerWidth, H = window.innerHeight;
const FOV = 46;
const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ canvas: viewCanvas, antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const hemi = new THREE.HemisphereLight(0xffffff, 0xd9cdbb, 0.45);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 0.92);
key.position.set(9, 15, 7);
key.castShadow = true;
scene.add(key);

const shadowMat = new THREE.ShadowMaterial({ opacity: 0.12 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80).rotateX(-Math.PI / 2), shadowMat);
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(28, 28, 0xb8ad9c, 0xd3c9ba);
grid.position.y = 0.002;
scene.add(grid);

const world = new THREE.Group();
scene.add(world);

const blockMat = new THREE.MeshLambertMaterial({ color: 0xfaf7f2 });
const block = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.7, 0.9), blockMat);
block.position.set(-2.7, 0.85, 1.7);
block.castShadow = true;
world.add(block);

const SIZE = 3.4;
const surface = new THREE.Group();
world.add(surface);
const planeGeo = new THREE.PlaneGeometry(SIZE, SIZE).rotateX(-Math.PI / 2);
const faceMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
surface.add(new THREE.Mesh(planeGeo, faceMat));
surface.position.set(0, 1.1, 0);

const selBox = new THREE.Box3();
const outline = new THREE.Box3Helper(selBox, 0x332e28);
scene.add(outline);
function markSelection() {
  selBox.setFromObject(targetObj);
  if (selBox.isEmpty()) { outline.visible = false; return; }
  selBox.expandByScalar(0.09);
  outline.visible = true;
}

const obj = { pos: new THREE.Vector3(), quat: new THREE.Quaternion() };
const disp = { pos: new THREE.Vector3(), quat: new THREE.Quaternion() };
let targetObj = surface;
function syncFromTarget() {
  targetObj.updateWorldMatrix(true, false);
  targetObj.getWorldPosition(obj.pos);
  targetObj.getWorldQuaternion(obj.quat);
  disp.pos.copy(obj.pos);
  disp.quat.copy(obj.quat);
}
function commit() {
  const p = targetObj.parent;
  if (p) {
    p.updateWorldMatrix(true, false);
    targetObj.position.copy(p.worldToLocal(disp.pos.clone()));
    targetObj.quaternion.copy(
      p.getWorldQuaternion(new THREE.Quaternion()).invert().multiply(disp.quat));
  } else {
    targetObj.position.copy(disp.pos);
    targetObj.quaternion.copy(disp.quat);
  }
  targetObj.updateMatrixWorld(true);
  markSelection();
}
function jumpDisplay() {
  disp.pos.copy(obj.pos);
  disp.quat.copy(obj.quat);
  commit();
}
function easeDisplay(dt) {
  if (reduceMotion || !(gz.rotStep || gz.moveStep)) { jumpDisplay(); return false; }
  const near = disp.pos.distanceToSquared(obj.pos) < 1e-7 &&
               1 - Math.abs(disp.quat.dot(obj.quat)) < 1e-8;
  if (near) {
    if (!disp.pos.equals(obj.pos) || !disp.quat.equals(obj.quat)) { jumpDisplay(); return true; }
    return false;
  }
  const k = 1 - Math.exp(-Math.min(dt, 0.05) * 20);
  disp.pos.lerp(obj.pos, k);
  disp.quat.slerp(obj.quat, k);
  commit();
  return true;
}
const cam = { radius: 11, theta: 0.78, phi: 1.05, target: new THREE.Vector3(0, 1.1, 0) };

let T = {};
function isDark() {
  const forced = root.dataset.nvTheme;
  if (forced === 'dark') return true;
  if (forced === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function readTheme() {
  const cs = getComputedStyle($('nv'));
  const v = (n) => cs.getPropertyValue(n).trim();
  T = {
    up: v('--nv-up'), side: v('--nv-side'), front: v('--nv-front'),
    ghost: v('--nv-ghost'), hub: v('--nv-hub'), ink: v('--nv-ink'),
    shadow: isDark() ? 'rgba(0,0,0,0.55)' : 'rgba(51,46,40,0.28)',
    onColor: v('--nv-on-color'), line: v('--nv-line')
  };
  AXES[0].tone = T.up; AXES[1].tone = T.side; AXES[2].tone = T.front;

  const dark = isDark();
  scene.background = new THREE.Color(dark ? 0x1c1b19 : 0xe8e0d4);
  grid.material.color.set(dark ? 0x4a453e : 0xb8ad9c);
  blockMat.color.set(dark ? 0x35322e : 0xfaf7f2);
  faceMat.color.set(dark ? 0x2c2a27 : 0xffffff);
  outline.material.color.set(dark ? 0xf2ede6 : 0x332e28);
  drawGizmo();
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
window.NV = {
  setTheme(mode) {
    if (mode === 'auto') delete root.dataset.nvTheme; else root.dataset.nvTheme = mode;
    readTheme();
  }
};

const gz = { size: 210, mode: 'look', rotStep: 15, moveStep: 0.5, active: null, hover: null, ring: null };
const gzc = $('nv-canvas'), gctx = gzc.getContext('2d');

const AXES = [
  { dir: [0, 1, 0], lbl: 'Up', back: 'Down', tone: '#e0822a' },
  { dir: [1, 0, 0], lbl: 'Side', back: 'Side', tone: '#2f80c4' },
  { dir: [0, 0, 1], lbl: 'Front', back: 'Back', tone: '#3f9a62' }
];

const CROP = 0.055;
const MIN_RAD = 0.55;
function metrics(S) { return { S, c: S / 2, arm: S * 0.235, hand: S * 0.102, hub: S * 0.072 }; }
function fitGizmo(size) {
  const dpr = Math.min(window.devicePixelRatio, 2);
  const h = Math.round(size * (1 - CROP * 2));
  gzc.style.width = size + 'px';
  gzc.style.height = h + 'px';
  gzc.width = Math.round(size * dpr);
  gzc.height = Math.round(h * dpr);
  gctx.setTransform(dpr, 0, 0, dpr, 0, -size * CROP * dpr);
  gzc.style.clipPath = 'circle(' + Math.round(size * 0.47) + 'px at 50% 50%)';
  gzc.style.webkitClipPath = gzc.style.clipPath;
  $('nv-dock').style.width = size + 'px';
}
function fit(canvas, ctx, size) {
  const dpr = Math.min(window.devicePixelRatio, 2);
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function axisDir(a) {
  const v = new THREE.Vector3(a.dir[0], a.dir[1], a.dir[2]);
  if (gz.mode !== 'look') v.applyQuaternion(disp.quat);
  return v.normalize();
}
function project(v, m) {
  const sp = Math.sin(cam.phi), cp = Math.cos(cam.phi);
  const st = Math.sin(cam.theta), ct = Math.cos(cam.theta);
  const sx = v.x * ct + v.z * -st;
  const sy = v.x * (-cp * st) + v.y * sp + v.z * (-cp * ct);
  const depth = v.x * (sp * st) + v.y * cp + v.z * (sp * ct);
  const len = Math.hypot(sx, sy);
  const draw = Math.max(len, MIN_RAD);
  const k = len < 1e-6 ? 0 : draw / len;
  const rad = m.arm * draw;
  return { x: m.c + sx * m.arm * k, y: m.c - sy * m.arm * k, depth, len, rad };
}
function handles(m) {
  const out = [];
  AXES.forEach((a, i) => {
    const d = axisDir(a);
    out.push({ a, i, sign: 1, dir: d, p: project(d, m) });
    const n = d.clone().negate();
    out.push({ a, i, sign: -1, dir: n, p: project(n, m) });
  });
  return out;
}
function labelFont(ctx, text, r) {
  let size = r * 0.66;
  const fam = getComputedStyle(document.body).fontFamily;
  for (let i = 0; i < 6; i++) {
    ctx.font = '600 ' + size.toFixed(1) + 'px ' + fam;
    if (ctx.measureText(text).width <= r * 1.62) break;
    size *= 0.9;
  }
}

function paint(ctx, m, live, now) {
  ctx.clearRect(-2, -2, m.S + 4, m.S + 4);
  const hs = handles(m).sort((p, q) => p.p.depth - q.p.depth);

  ctx.save();
  ctx.shadowColor = T.shadow;
  ctx.shadowBlur = 7;
  ctx.shadowOffsetY = 1.5;

  hs.forEach(h => {
    const front = h.p.depth >= -0.04;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(m.c, m.c);
    ctx.lineTo(h.p.x, h.p.y);
    if (h.sign > 0 && front) { ctx.strokeStyle = h.a.tone; ctx.lineWidth = 3; }
    else { ctx.strokeStyle = T.ghost; ctx.lineWidth = 1.2; ctx.setLineDash([3, 4]); }
    ctx.stroke();
    ctx.restore();
  });

  hs.forEach(h => {
    const front = h.p.depth >= -0.04;
    if (h.sign > 0 && front) return;
    const on = live && gz.active && gz.active.type === 'axis' && gz.active.i === h.i && gz.active.sign === h.sign;
    const hov = live && gz.hover && gz.hover.i === h.i && gz.hover.sign === h.sign;
    ctx.beginPath();

const MOVE_STEPS = [{ v: 0, lbl: 'Free' }, { v: 0.25, lbl: '0.25' }, { v: 0.5, lbl: '0.5' }, { v: 1, lbl: '1' }];
function buildSteps() {
  [['nv-rot-steps', ROT_STEPS, 'rotStep'], ['nv-move-steps', MOVE_STEPS, 'moveStep']]
    .forEach(([id, opts, key]) => {
      const host = $(id);
      host.innerHTML = '';
      opts.forEach(o => {
        const b = document.createElement('button');
        b.className = 'nv-chip';
        b.textContent = o.lbl;
        b.onclick = () => { gz[key] = o.v; refreshSteps(); saveLayout(); say(o.lbl === 'Free' ? 'free movement' : 'steps of ' + o.lbl, true); };
        host.appendChild(b);
      });
    });
  refreshSteps();
}
function refreshSteps() {
  [['nv-rot-steps', ROT_STEPS, 'rotStep'], ['nv-move-steps', MOVE_STEPS, 'moveStep']]
    .forEach(([id, opts, key]) => {
      [...$(id).children].forEach((el, i) =>
        el.setAttribute('aria-pressed', String(opts[i].v === gz[key])));
    });
}

function setMode(mode) {
  gz.mode = mode;
  nv.dataset.mode = mode;
  [['nv-move', 'move'], ['nv-turn', 'rotate'], ['nv-look', 'look']]
    .forEach(([id, v]) => $(id).setAttribute('aria-pressed', String(mode === v)));
  refreshSteps();
  idleHint(); drawGizmo(); saveLayout();
}
$('nv-move').onclick = () => { stopTour(); setMode('move'); };
$('nv-turn').onclick = () => { stopTour(); setMode('rotate'); };
$('nv-look').onclick = () => { stopTour(); setMode('look'); };

function setOrient(pitch, roll, label) {
  stopTour(); pushHistory();
  const e = new THREE.Euler().setFromQuaternion(obj.quat, 'YXZ');
  obj.quat.setFromEuler(new THREE.Euler(pitch * DEG, e.y, roll * DEG, 'YXZ'));
  applyObject(); say(label, true);
}
$('nv-flat').onclick = () => setOrient(0, 0, 'Flat like a table');
$('nv-wall').onclick = () => setOrient(90, 0, 'Up like a wall');
$('nv-lean').onclick = () => setOrient(45, 0, 'Leaning like a ramp');
$('nv-face').onclick = () => {
  stopTour();
  cam.target.copy(obj.pos);
  faceDirection(new THREE.Vector3(0, 1, 0).applyQuaternion(obj.quat), '');
  say('Looking straight at it', true);
};
$('nv-undo').onclick = () => { stopTour(); undo(); };
$('nv-reset').onclick = () => {
  stopTour(); pushHistory();
  const home = targets[current] && targets[current].home;
  if (home) { targetObj.position.copy(home.p); targetObj.quaternion.copy(home.q); }
  syncFromTarget();
  cam.target.copy(obj.pos);
  applyObject(); applyCamera();
  say((targets[current] ? targets[current].name : 'It') + ' back to the start', true);
};
$('host-grid').onclick = () => { grid.visible = !grid.visible; };

let tour = null;
const TOUR = [
  { t: 0, dur: 4200, ring: { type: 'axis', i: 0 }, cap: 'Drag the orange arrow to lift it up.' },
  { t: 4200, dur: 4200, ring: { type: 'axis', i: 1 }, cap: 'Tap a dot to look from that side. Tapping never moves it.' },
  { t: 8400, dur: 4600, ring: { type: 'hub' }, cap: 'Tap the middle circle to switch to Turn.' },
  { t: 13000, dur: 2200, ring: null, cap: 'Your turn. Undo fixes anything.' }
];
function startTour() {
  stopTour();
  tour = { start: performance.now(), step: -1,
    save: { pos: obj.pos.clone(), quat: obj.quat.clone(), phi: cam.phi, theta: cam.theta, mode: gz.mode } };
  setMode('move');
  setMenu(false);
  $('nv-tour').textContent = 'Stop the demo';
}
function stopTour() {
  if (!tour) return;
  const s = tour.save;
  obj.pos.copy(s.pos); obj.quat.copy(s.quat);
  cam.phi = s.phi; cam.theta = s.theta;
  flight = null; gz.ring = null; tour = null;
  $('nv-tour').textContent = 'Show me how';
  setMode(s.mode);
  applyObject(); applyCamera(); idleHint();
}
function stepTour(now) {
  if (!tour) return;
  const el = Math.max(0, now - tour.start);
  let idx = 0;
  for (let i = 0; i < TOUR.length; i++) if (el >= TOUR[i].t) idx = i;
  const last = TOUR[TOUR.length - 1];
  if (el > last.t + last.dur) { stopTour(); return; }

  if (idx !== tour.step) {
    tour.step = idx;
    const s = TOUR[idx];
    gz.ring = s.ring;
    const label = $('nv-label');
    label.textContent = s.cap;
    label.classList.add('nv-live');
    if (idx === 1) {
      const h = handles(metrics(gz.size)).filter(k => k.i === 1 && k.sign === 1)[0];
      if (h) faceDirection(h.dir, '');
    }
    if (idx === 2) setMode('rotate');
    if (idx === 3) { setMode('move'); flyTo(tour.save.phi, tour.save.theta, 600); }
  }
  const s = TOUR[idx];
  const wave = Math.sin(Math.min(1, (el - s.t) / s.dur * 1.25) * Math.PI);
  if (idx === 0) {
    obj.pos.copy(tour.save.pos);
    obj.pos.y = tour.save.pos.y + wave * 1.6;
    applyObject();
  } else if (idx === 2) {
    obj.quat.copy(tour.save.quat).premultiply(
      new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), wave * 50 * DEG));
    applyObject();
  }
  drawGizmo(now);
}
$('nv-tour').onclick = () => { tour ? stopTour() : startTour(); };

$('host-theme').onclick = () => NV.setTheme(isDark() ? 'light' : 'dark');
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'escape') stopTour();
  else if (k === 'z') { e.preventDefault(); undo(); }
});
window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  renderer.setSize(W, H);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  sizeToBox();
  applyCamera();
  placeFromAnchor();
});
let lastFrame = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = lastFrame ? Math.min(0.06, (now - lastFrame) / 1000) : 0.016;
  lastFrame = now;
  stepFlight(now);
  stepTour(now);
  if (easeDisplay(dt)) drawGizmo(now);
  renderer.render(scene, camera);
}
loadLayout();
sizeToBox();
buildTargets();
buildSteps();
setMode(gz.mode);
readTheme();
applyObject();
applyCamera();
idleHint();
placeFromAnchor();
requestAnimationFrame(loop);
</script>
</body>
</html>
